[project]
name = "ai-first-lms-data-mcp"
version = "0.1.0"
description = "Data layer and MCP servers for AI-First LMS"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "alembic>=1.13.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "pgvector>=0.3.0",
    "mcp>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/data_mcp/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

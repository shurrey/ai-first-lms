# docker-compose.yaml — AI-First LMS Prototype
# Owned by Platform workstream (T-P-*)
# Usage: docker compose up
# Docs: docs/setup.md

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lms-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./contracts/db-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- MCP servers (real implementations via SSE transport) ---

  mcp-content:
    build:
      context: .
      dockerfile: src/data_mcp/Dockerfile
      args:
        CORPORATE_CA_PATH: ${CORPORATE_CA_PATH:-}
      secrets:
        - corporate_ca
    command: ["uvicorn", "data_mcp.mcp_servers.content.server:app", "--host", "0.0.0.0", "--port", "7001"]
    container_name: lms-mcp-content
    environment:
      PORT: "7001"
      LMS_DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms_dev}@postgres:5432/${POSTGRES_DB:-lms_db}
    ports:
      - "${MCP_CONTENT_PORT:-7001}:7001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7001/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp-roster:
    build:
      context: .
      dockerfile: src/data_mcp/Dockerfile
      args:
        CORPORATE_CA_PATH: ${CORPORATE_CA_PATH:-}
      secrets:
        - corporate_ca
    command: ["uvicorn", "data_mcp.mcp_servers.roster.server:app", "--host", "0.0.0.0", "--port", "7002"]
    container_name: lms-mcp-roster
    environment:
      PORT: "7002"
      LMS_DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms_dev}@postgres:5432/${POSTGRES_DB:-lms_db}
    ports:
      - "${MCP_ROSTER_PORT:-7002}:7002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7002/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp-assessments:
    build:
      context: .
      dockerfile: src/data_mcp/Dockerfile
      args:
        CORPORATE_CA_PATH: ${CORPORATE_CA_PATH:-}
      secrets:
        - corporate_ca
    command: ["uvicorn", "data_mcp.mcp_servers.assessments.server:app", "--host", "0.0.0.0", "--port", "7003"]
    container_name: lms-mcp-assessments
    environment:
      PORT: "7003"
      LMS_DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms_dev}@postgres:5432/${POSTGRES_DB:-lms_db}
    ports:
      - "${MCP_ASSESSMENTS_PORT:-7003}:7003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7003/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp-analytics:
    build:
      context: .
      dockerfile: src/data_mcp/Dockerfile
      args:
        CORPORATE_CA_PATH: ${CORPORATE_CA_PATH:-}
      secrets:
        - corporate_ca
    command: ["uvicorn", "data_mcp.mcp_servers.analytics.server:app", "--host", "0.0.0.0", "--port", "7004"]
    container_name: lms-mcp-analytics
    environment:
      PORT: "7004"
      LMS_DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms_dev}@postgres:5432/${POSTGRES_DB:-lms_db}
    ports:
      - "${MCP_ANALYTICS_PORT:-7004}:7004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7004/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp-sis:
    build:
      context: .
      dockerfile: src/data_mcp/Dockerfile
      args:
        CORPORATE_CA_PATH: ${CORPORATE_CA_PATH:-}
      secrets:
        - corporate_ca
    command: ["uvicorn", "data_mcp.mcp_servers.sis.server:app", "--host", "0.0.0.0", "--port", "7005"]
    container_name: lms-mcp-sis
    environment:
      PORT: "7005"
      LMS_DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms_dev}@postgres:5432/${POSTGRES_DB:-lms_db}
    ports:
      - "${MCP_SIS_PORT:-7005}:7005"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7005/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp-communications:
    build:
      context: .
      dockerfile: src/data_mcp/Dockerfile
      args:
        CORPORATE_CA_PATH: ${CORPORATE_CA_PATH:-}
      secrets:
        - corporate_ca
    command: ["uvicorn", "data_mcp.mcp_servers.communications.server:app", "--host", "0.0.0.0", "--port", "7006"]
    container_name: lms-mcp-communications
    environment:
      PORT: "7006"
      LMS_DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms_dev}@postgres:5432/${POSTGRES_DB:-lms_db}
    ports:
      - "${MCP_COMMUNICATIONS_PORT:-7006}:7006"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7006/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp-standards:
    build:
      context: .
      dockerfile: src/data_mcp/Dockerfile
      args:
        CORPORATE_CA_PATH: ${CORPORATE_CA_PATH:-}
      secrets:
        - corporate_ca
    command: ["uvicorn", "data_mcp.mcp_servers.standards.server:app", "--host", "0.0.0.0", "--port", "7007"]
    container_name: lms-mcp-standards
    environment:
      PORT: "7007"
      LMS_DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms_dev}@postgres:5432/${POSTGRES_DB:-lms_db}
    ports:
      - "${MCP_STANDARDS_PORT:-7007}:7007"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7007/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Orchestrator (real Engine implementation) ---

  orchestrator:
    build:
      context: .
      dockerfile: src/engine/Dockerfile
      args:
        CORPORATE_CA_PATH: ${CORPORATE_CA_PATH:-}
      secrets:
        - corporate_ca
    container_name: lms-orchestrator
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms_dev}@postgres:5432/${POSTGRES_DB:-lms_db}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FISH_AUDIO_API_KEY: ${FISH_AUDIO_API_KEY:-}
      FISH_AUDIO_HOST_VOICE: ${FISH_AUDIO_HOST_VOICE:-}
      FISH_AUDIO_EXPERT_VOICE: ${FISH_AUDIO_EXPERT_VOICE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      TLS_INSECURE_SKIP_VERIFY: ${TLS_INSECURE_SKIP_VERIFY:-false}
      # Per-turn caps (SPEC-v1 §4.5); exceeding one ends the turn with error budget_exceeded.
      MAX_TOKENS_PER_TURN: ${MAX_TOKENS_PER_TURN:-250000}
      MAX_TOOL_CALLS_PER_TURN: ${MAX_TOOL_CALLS_PER_TURN:-40}
      MAX_WALL_TIME_PER_TURN_MS: ${MAX_WALL_TIME_PER_TURN_MS:-120000}
      MAX_AGENT_INVOCATIONS_PER_TURN: ${MAX_AGENT_INVOCATIONS_PER_TURN:-8}
      # Sign-in (spec §4.4). COOKIE_SECURE must stay false for plain http://localhost.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-5}
      LOGIN_FAILURE_FLOOR_MS: ${LOGIN_FAILURE_FLOOR_MS:-250}
      # How long an agent's approval_request waits for POST /api/approval.
      APPROVAL_TIMEOUT_MINUTES: ${APPROVAL_TIMEOUT_MINUTES:-30}
      ENGINE_API_DOCS: ${ENGINE_API_DOCS:-false}
      PII_PSEUDONYM_SALT: ${PII_PSEUDONYM_SALT:-}
    ports:
      - "${ORCHESTRATOR_PORT:-8000}:8000"
    volumes:
      - audio-data:/app/audio
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Frontend (real Next.js implementation) ---

  frontend:
    build: src/frontend
    container_name: lms-frontend
    environment:
      PORT: "3000"
      # Next standalone binds to $HOSTNAME (the container id by default). The healthcheck
      # uses 127.0.0.1 because localhost resolves to ::1 first in this image.
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://orchestrator:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ultra-frontend:
    build: src/ultra-frontend
    container_name: lms-ultra-frontend
    environment:
      PORT: "3100"
      # Next standalone binds to $HOSTNAME (the container id by default). The healthcheck
      # uses 127.0.0.1 because localhost resolves to ::1 first in this image.
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://orchestrator:8000
    ports:
      - "${ULTRA_FRONTEND_PORT:-3100}:3100"
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Database seed (one-shot) ---

  db-seed:
    build:
      context: .
      dockerfile: src/data_mcp/Dockerfile
      args:
        CORPORATE_CA_PATH: ${CORPORATE_CA_PATH:-}
      secrets:
        - corporate_ca
    container_name: lms-db-seed
    command: ["python", "-m", "data_mcp.seed.all_courses", "--seed", "42"]
    environment:
      LMS_DATABASE_URL: postgresql://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms_dev}@postgres:5432/${POSTGRES_DB:-lms_db}
      TLS_INSECURE_SKIP_VERIFY: ${TLS_INSECURE_SKIP_VERIFY:-false}
      # Password for every seeded account. Compose refuses to start any service while it is unset.
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?set SEED_DEMO_PASSWORD in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- Observability ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: lms-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./src/platform/otel/collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "8889:8889"
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.4.1
    container_name: lms-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./src/platform/otel/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: lms-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./src/platform/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.1
    container_name: lms-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./src/platform/otel/grafana-provisioning:/etc/grafana/provisioning:ro
      - ./src/platform/otel/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped

# Optional corporate root CA for the Python images (BuildKit build secret).
# The empty certs/.gitkeep default means "no extra CA"; see docs/setup.md.
secrets:
  corporate_ca:
    file: ${CORPORATE_CA_PATH:-./certs/.gitkeep}

volumes:
  pgdata:
  audio-data:
  tempo-data:
  prometheus-data:
  grafana-data:

  # ---------------------------------------------------------------------------
  # Policy (planned)
  # ---------------------------------------------------------------------------

  /api/policy/effective:
    get:
      tags: [policy]
      summary: Resolve policy keys for a context, with source and precedence chain
      operationId: getEffectivePolicy
      x-implementation-status: planned
      x-task: T-E-115
      x-required-capability: authenticated
      x-scope-check: |
        course_id must be in the caller's course list; learner_id defaults to
        the caller and must be self or a student the caller may view
      security:
        - sessionCookie: []
      description: |
        Calls `policy.resolve` for each key. Program ids are derived from the
        course's `part_of` edges. Without `key`, all registry keys are
        returned. `editable` reflects whether the caller may set the key at
        `editable_scope` right now (holds the scope and it is not locked above).
      parameters:
        - in: query
          name: key
          description: Repeatable. Registry key, e.g. `tutor.answer_mode`.
          schema:
            type: array
            items: {type: string}
          style: form
          explode: true
        - in: query
          name: course_id
          schema: {type: string, format: uuid}
        - in: query
          name: program_id
          description: Resolve at program scope without a course (Program Policy surface).
          schema: {type: string, format: uuid}
        - in: query
          name: learner_id
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [context, policies]
                properties:
                  context:
                    type: object
                    properties:
                      course_id: {type: [string, "null"], format: uuid}
                      program_ids: {type: array, items: {type: string, format: uuid}}
                      learner_id: {type: [string, "null"], format: uuid}
                  policies:
                    type: array
                    items: {$ref: "#/components/schemas/PolicyResolved"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /api/policy/set:
    post:
      tags: [policy]
      summary: Set (or clear) a policy value at one scope
      operationId: setPolicy
      x-implementation-status: planned
      x-task: T-E-115
      x-required-capability: policy_edit
      x-scope-check: |
        institution: admin; program: program_lead of scope_id; course: faculty
        of scope_id; learner: scope_id = caller (student). vendor_default is
        never writable.
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Calls `policy.set`. Append-only: supersedes the current row for
        (key, scope_type, scope_id) and inserts version+1 with `set_by` = the
        caller. `clear: true` supersedes without a replacement, so the scope
        inherits again. The request is the human approval; it does not go
        through approval_request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, scope_type, rationale]
              properties:
                key: {type: string}
                scope_type: {$ref: "#/components/schemas/WritablePolicyScope"}
                scope_id:
                  type: [string, "null"]
                  format: uuid
                  description: Null for institution; required otherwise.
                value:
                  description: Must validate against the key's registry schema. Omit when clear=true.
                locked: {type: boolean, default: false}
                clear: {type: boolean, default: false}
                rationale:
                  type: string
                  minLength: 1
                  description: Shown in the explainer.
                expected_version:
                  type: [integer, "null"]
                  description: Optimistic concurrency; 409 if the current version differs.
      responses:
        "200":
          description: Saved. Returns the new row (or the superseded row when clear=true) and the re-resolved value.
          content:
            application/json:
              schema:
                type: object
                required: [setting, resolved]
                properties:
                  setting: {$ref: "#/components/schemas/PolicySetting"}
                  resolved: {$ref: "#/components/schemas/PolicyResolved"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: Locked by a higher-precedence scope, or expected_version mismatch.
          content:
            application/json:
              schema:
                type: object
                required: [detail]
                properties:
                  detail: {type: string}
                  locked_by: {$ref: "#/components/schemas/PolicySource"}
                  current_version: {type: [integer, "null"]}
        "422":
          description: |
            Unknown key, scope not allowed for the key, value fails the key's
            schema, or a learner value that is not stricter than the inherited one.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}


                    minItems: 5
                    maxItems: 5
                    uniqueItems: true
                rationale: {type: [string, "null"]}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PolicyPrecedence"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /api/policy/presets:

        "201":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletionRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: A pending request already exists.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}

  /api/deletion-requests:
    get:
      tags: [privacy]
      summary: Deletion requests queue (admin)
      operationId: listDeletionRequests
      x-implementation-status: planned
      x-task: T-E-124
      x-required-capability: deletion_request_approval
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: status
          schema: {$ref: "#/components/schemas/DeletionRequestStatus"}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/DeletionRequest"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/deletion-requests/{request_id}/decision:
    post:
      tags: [privacy]
      summary: Approve (and execute) or reject a deletion request (admin)
      operationId: decideDeletionRequest
      x-implementation-status: planned
      x-task: T-E-124
      x-required-capability: deletion_request_approval
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - in: path
          name: request_id
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
                reason: {type: [string, "null"]}
      responses:
        "200":
          description: Decided; on approve the purge has completed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletionRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Request is not pending.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}

  # ---------------------------------------------------------------------------
  # Notifications (planned)
  # ---------------------------------------------------------------------------

  /api/notifications:
    get:
      tags: [notifications]
      summary: The caller's notifications, newest first (dismissed excluded)
      operationId: listNotifications
      x-implementation-status: planned
      x-task: T-E-121
      x-required-capability: notifications
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: unread_only
          schema: {type: boolean, default: false}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items, unread_count]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Notification"}
                  unread_count: {type: integer, minimum: 0}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark all of the caller's notifications read
      operationId: markAllNotificationsRead
      x-implementation-status: planned
      x-task: T-E-121
      x-required-capability: notifications
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [unread_count]
                properties:
                  unread_count: {type: integer, const: 0}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/notifications/{notification_id}/read:
    post:
      tags: [notifications]
      summary: Mark one notification read (idempotent)
      operationId: markNotificationRead
      x-implementation-status: planned
      x-task: T-E-121
      x-required-capability: notifications
      x-scope-check: notification belongs to the caller (404 otherwise)
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/NotificationIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Notification"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/notifications/{notification_id}/dismiss:
    post:
      tags: [notifications]
      summary: Dismiss one notification (idempotent)
      operationId: dismissNotification
      x-implementation-status: planned
      x-task: T-E-121
      x-required-capability: notifications
      x-scope-check: notification belongs to the caller (404 otherwise)
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        When the notification has an `ai_action_id` (nudge / alert), also
        writes `human_decisions(decision=dismissed)`.
      parameters:
        - $ref: "#/components/parameters/NotificationIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Notification"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ---------------------------------------------------------------------------
  # Study aids: flashcards (planned)
  # ---------------------------------------------------------------------------

  /api/flashcards/decks:
    post:
      tags: [study]
      summary: Generate a flashcard deck from a reading or a set of concept nodes
      operationId: generateFlashcardDeck
      x-implementation-status: planned
      x-task: T-A-107
      x-required-capability: content_generation
      x-scope-check: student enrolled in course_id (deck is for self); faculty of course_id
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Calls `content.generate_flashcards`; honors `ai.content_sources`.
        Exactly one of `content_item_id` or `node_ids` is required.
        Synchronous: returns once the deck is saved as a `flashcard_deck`
        content item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id]
              properties:
                course_id: {type: string, format: uuid}
                content_item_id: {type: [string, "null"], format: uuid}
                node_ids:
                  type: [array, "null"]
                  items: {type: string, format: uuid}
                count: {type: integer, minimum: 1, maximum: 50, default: 10}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FlashcardDeck"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Out of scope, source excluded by ai.content_sources, or CSRF failure.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    get:
      tags: [study]
      summary: Flashcard decks the caller can use
      operationId: listFlashcardDecks
      x-implementation-status: planned
      x-task: T-A-107
      x-required-capability: authenticated
      x-scope-check: decks in the caller's courses (students also see their own generated decks)
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: course_id
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [decks]
                properties:
                  decks:
                    type: array
                    items: {$ref: "#/components/schemas/FlashcardDeckSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/flashcards/decks/{deck_id}:
    get:
      tags: [study]
      summary: One flashcard deck with its cards
      operationId: getFlashcardDeck
      x-implementation-status: planned
      x-task: T-A-107
      x-required-capability: authenticated
      x-scope-check: same as GET /api/flashcards/decks
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/DeckIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FlashcardDeck"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/flashcards/decks/{deck_id}/cards/{card_id}/review:
    post:
      tags: [study]
      summary: Grade one card review (Again / Hard / Good / Easy)
      operationId: reviewFlashcard
      x-implementation-status: planned
      x-task: T-A-107
      x-required-capability: authenticated
      x-scope-check: caller is a student enrolled in the deck's course
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Feeds the SM-2 scheduler (§10.2, T-D-109) for the card's `node_id`.
        Scheduling state is per concept (concept_reviews), so cards on the
        same node share one schedule. Evidence from reviews is `private`.
      parameters:
        - $ref: "#/components/parameters/DeckIdPath"
        - in: path
          name: card_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade]
              properties:
                grade: {type: string, enum: [again, hard, good, easy]}
      responses:
        "200":
          description: Updated schedule for the card's concept
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReviewSchedule"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  # ---------------------------------------------------------------------------
  # Podcast (existing)
  # ---------------------------------------------------------------------------

  /api/generate-podcast:
    post:
      tags: [podcast]
      summary: Generate a personalized two-voice audio lesson
      operationId: generatePodcast
      description: |
        Concept selection: explicit `concept_ids`, else concepts inferred from
        the session's conversation, else the student's emerging/proficient
        concepts. At most 5 concepts are used. Synchronous: the request returns
        once audio (or a text-only fallback) has been rendered.
        For the student role `person_id` must be the caller; faculty may name
        a student enrolled in their course. 403 otherwise.
      x-required-capability: content_generation
      x-scope-check: student = self; faculty = student enrolled in own course_id
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [person_id, course_id]
              properties:
                person_id: {type: string, format: uuid}
                course_id: {type: string, format: uuid}
                session_id:
                  type: [string, "null"]
                  description: In-memory session whose conversation guides concept choice.
                concept_ids:
                  type: [array, "null"]
                  items: {type: string}
      responses:
        "200":
          description: Podcast, or `{error}`
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [podcast_id, audio_url, script, segment_count, title]
                    properties:
                      podcast_id: {type: string}
                      audio_url:
                        type: string
                        description: |
                          `/audio/<podcast_id>.mp3`, or `/audio/<podcast_id>.txt`
                          when audio rendering is unavailable.
                      script: {type: string}
                      segment_count: {type: integer}
                      title: {type: string}
                  - $ref: "#/components/schemas/ToolError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          description: Malformed body
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}

  /audio/{filename}:
    get:
      tags: [podcast]
      summary: Serve a generated podcast file
      operationId: serveAudio
      x-required-capability: authenticated
      security:
        - sessionCookie: []
      description: |
        Requires a session cookie (sent automatically by `<audio src>` on the
        same host). Files carry no owner, so there is no object-level check.
      parameters:
        - in: path
          name: filename
          required: true
          schema: {type: string}
      responses:
        "200":
          description: |
            The file (`audio/mpeg` for .mp3, `text/plain` for .txt). A missing
            file returns 200 with JSON `{"error": "Audio file not found"}`.
          content:
            audio/mpeg:
              schema: {type: string, contentEncoding: binary}
            text/plain:
              schema: {type: string}
            application/json:
              schema: {$ref: "#/components/schemas/ToolError"}
        "401": {$ref: "#/components/responses/Unauthorized"}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lms_session
      description: |
        Opaque session token set by POST /api/auth/login. HttpOnly;
        SameSite=Lax; Path=/; Secure when COOKIE_SECURE=true; Max-Age =
        SESSION_TTL_HOURS (default 12) with sliding expiry. The server stores
        only sha256(token) in auth_sessions.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit CSRF token. Must equal the `lms_csrf` cookie (the
        session's csrf_token). Required on every non-GET /api/* request except
        POST /api/auth/login; missing or mismatched returns 403.

  responses:
    Unauthorized:
      description: No session cookie, or the session is expired or revoked. Clients clear state and redirect to /login.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorDetail"}
    Forbidden:
      description: Missing or mismatched X-CSRF-Token, or the caller lacks the capability or scope.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorDetail"}
    NotFound:
      description: No such resource in the caller's scope.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorDetail"}
    ValidationFailed:
      description: Malformed body or parameters.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ValidationError"}

  parameters:
    PersonIdPath:
      in: path
      name: person_id
      required: true
      schema: {type: string, format: uuid}
    CourseIdPath:
      in: path
      name: course_id
      required: true
      schema: {type: string, format: uuid}
    SessionIdPath:
      in: path
      name: session_id
      required: true
      schema: {type: string}
    PendingIdPath:
      in: path
      name: pending_id
      required: true
      schema: {type: string, format: uuid}
    ProgramIdPath:
      in: path
      name: program_id
      required: true
      description: Program node id.
      schema: {type: string, format: uuid}
    SubmissionIdPath:
      in: path
      name: submission_id
      required: true
      schema: {type: string, format: uuid}
    AiActionIdPath:
      in: path
      name: ai_action_id
      required: true
      schema: {type: string, format: uuid}
    NotificationIdPath:
      in: path
      name: notification_id
      required: true
      schema: {type: string, format: uuid}
    DeckIdPath:
      in: path
      name: deck_id
      required: true
      description: content_items.id of a `flashcard_deck`.
      schema: {type: string, format: uuid}
    From:
      in: query
      name: from
      required: false
      description: Inclusive start (ISO 8601).
      schema: {type: string, format: date-time}
    To:
      in: query
      name: to
      required: false
      description: Exclusive end (ISO 8601). Default now.
      schema: {type: string, format: date-time}
    Limit:
      in: query
      name: limit
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      in: query
      name: cursor
      required: false
      description: Opaque `next_cursor` from the previous page.
      schema: {type: string}

  schemas:
    ToolError:
      type: object
      required: [error]
      properties:
        error: {type: string}

    ErrorDetail:
      description: FastAPI HTTPException body.
      type: object
      required: [detail]
      properties:
        detail: {}

    ValidationError:
      description: FastAPI request-validation body.
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc: {type: array, items: {}}
              msg: {type: string}
              type: {type: string}

    # ---- auth --------------------------------------------------------------

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Case-insensitive; defaults to the person's email.
        password: {type: string}

    PersonRole:
      type: string
      enum: [student, faculty, program_lead, advisor, admin]

    Enrollment:
      type: object
      required: [course_id, slug, title, role]
      properties:
        course_id: {type: string, format: uuid}
        slug: {type: string, examples: [cs101]}
        title: {type: string}
        role:
          type: string
          description: enrollments.role
          enum: [student, faculty, ta, observer]

    CapabilityGrant:
      description: |
        Present = granted. `scope` is whose data; `access` is how much. Values
        already reflect policy (e.g. data.instructor_transcript_access), so a
        policy of `none` removes the key.
      type: object
      required: [scope, access]
      properties:
        scope: {type: string, enum: [self, own, program, assigned, all]}
        access: {type: string, enum: [full, read, summary, aggregate]}

    Capabilities:
      description: |
        Computed server-side from the §17 matrix for the active role. A missing
        key means not permitted. The server enforces the same rules.
      type: object
      additionalProperties: false
      properties:
        course_list: {$ref: "#/components/schemas/CapabilityGrant"}
        tutor_chat: {$ref: "#/components/schemas/CapabilityGrant"}
        content_generation: {$ref: "#/components/schemas/CapabilityGrant"}
        submit_work: {$ref: "#/components/schemas/CapabilityGrant"}
        feedback_release: {$ref: "#/components/schemas/CapabilityGrant"}
        grade_commit: {$ref: "#/components/schemas/CapabilityGrant"}
        improvement_view: {$ref: "#/components/schemas/CapabilityGrant"}
        mastery_matrix: {$ref: "#/components/schemas/CapabilityGrant"}
        attestation_override: {$ref: "#/components/schemas/CapabilityGrant"}
        badge_approve: {$ref: "#/components/schemas/CapabilityGrant"}
        badge_revoke: {$ref: "#/components/schemas/CapabilityGrant"}
        roster: {$ref: "#/components/schemas/CapabilityGrant"}
        transcripts_of_others: {$ref: "#/components/schemas/CapabilityGrant"}
        learner_profile_of_others: {$ref: "#/components/schemas/CapabilityGrant"}
        early_alert_flags: {$ref: "#/components/schemas/CapabilityGrant"}
        degree_audit: {$ref: "#/components/schemas/CapabilityGrant"}
        ai_review: {$ref: "#/components/schemas/CapabilityGrant"}
        ai_actions_log: {$ref: "#/components/schemas/CapabilityGrant"}
        policy_edit: {$ref: "#/components/schemas/CapabilityGrant"}
        policy_precedence: {$ref: "#/components/schemas/CapabilityGrant"}
        compliance_report: {$ref: "#/components/schemas/CapabilityGrant"}
        program_outcome_report: {$ref: "#/components/schemas/CapabilityGrant"}
        my_data: {$ref: "#/components/schemas/CapabilityGrant"}
        deletion_request_approval: {$ref: "#/components/schemas/CapabilityGrant"}
        system_settings:
          description: §17 "Badge issuer / provider settings"; gates /api/settings.
          $ref: "#/components/schemas/CapabilityGrant"
        notifications: {$ref: "#/components/schemas/CapabilityGrant"}

    Me:
      description: The /api/auth/me payload (also returned by login and role switch).
      type: object
      required: [person, roles, active_role, enrollments, advisees_count, home_route,
                 capabilities, effective_ui_policy, must_change_password]
      properties:
        person:
          type: object
          required: [id, display_name, email]
          properties:
            id: {type: string, format: uuid}
            display_name: {type: string}
            email: {type: [string, "null"]}
        roles:
          type: array
          items: {$ref: "#/components/schemas/PersonRole"}
          minItems: 1
        active_role: {$ref: "#/components/schemas/PersonRole"}
        enrollments:
          type: array
          description: Courses for the course list. Empty for advisor/admin, who use a scope entry instead.
          items: {$ref: "#/components/schemas/Enrollment"}
        advisees_count:
          type: integer
          minimum: 0
          description: Rows in advisor_assignments for this person; 0 unless advisor.
        home_route:
          type: string
          description: Default landing route for the active role (§9), e.g. `/`.
        capabilities: {$ref: "#/components/schemas/Capabilities"}
        effective_ui_policy:
          type: object
          description: |
            Resolved values of `ui`-enforced policy keys the UI needs (e.g.
            `gamification.show_mastery_bars`), keyed by registry key. Values only;
            use /api/policy/effective for sources.
          additionalProperties: {}
        must_change_password:
          type: boolean
          description: credentials.must_change; the UI routes to Change password when true.

    # ---- home --------------------------------------------------------------

    HomePayload:
      oneOf:
        - $ref: "#/components/schemas/StudentHome"
        - $ref: "#/components/schemas/FacultyHome"
        - $ref: "#/components/schemas/ProgramLeadHome"
        - $ref: "#/components/schemas/AdvisorHome"
        - $ref: "#/components/schemas/AdminHome"
      discriminator:
        propertyName: role
        mapping:
          student: "#/components/schemas/StudentHome"
          faculty: "#/components/schemas/FacultyHome"
          program_lead: "#/components/schemas/ProgramLeadHome"
          advisor: "#/components/schemas/AdvisorHome"
          admin: "#/components/schemas/AdminHome"

    CourseRef:
      type: object
      required: [course_id, title]
      properties:
        course_id: {type: string, format: uuid}
        slug: {type: [string, "null"]}
        title: {type: string}

    DueItem:
      type: object
      required: [assignment_id, title, course, due_at, status]
      properties:
        assignment_id: {type: string, format: uuid}
        title: {type: string}
        course: {$ref: "#/components/schemas/CourseRef"}
        due_at: {type: string, format: date-time}
        status: {type: string, enum: [not_started, draft_submitted, submitted]}
        link: {type: [string, "null"]}

    WhyItem:
      description: One plain-language reason with the source it came from.
      type: object
      required: [text]
      properties:
        text: {type: string, examples: ["Your last two ENG 102 drafts scored 'Developing' on Evidence."]}
        source: {$ref: "#/components/schemas/ProvenanceSource"}

    Recommendation:
      type: object
      required: [ai_action_id, title, why]
      properties:
        ai_action_id:
          type: string
          format: uuid
          description: Start / Snooze / Not helpful post to /api/ai-actions/{ai_action_id}/decisions.
        title: {type: string}
        course: {$ref: "#/components/schemas/CourseRef"}
        link: {type: [string, "null"]}
        why:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/WhyItem"}

    CalendarEvent:
      type: object
      required: [id, title, starts_at, kind]
      properties:
        id: {type: string}
        title: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: [string, "null"], format: date-time}
        kind: {type: string, enum: [due, review, event]}
        course: {$ref: "#/components/schemas/CourseRef"}
        link: {type: [string, "null"]}

    Goal:
      type: object
      properties:
        description: {type: string}
        target_date: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        status: {type: string}

    StudentHome:
      type: object
      required: [role, due_items, practice_sets, reviews_due, recommendations, mastery,
                 goals, grade_outlook, calendar, unread_notifications]
      properties:
        role: {type: string, const: student}
        due_items:
          type: array
          description: Sorted by due_at ascending, across all enrolled courses.
          items: {$ref: "#/components/schemas/DueItem"}
        practice_sets:
          type: array
          items:
            type: object
            required: [ai_action_id, title, item_count]
            properties:
              ai_action_id: {type: string, format: uuid}
              title: {type: string}
              course: {$ref: "#/components/schemas/CourseRef"}
              criterion_key: {type: [string, "null"]}
              item_count: {type: integer}
              link: {type: [string, "null"]}
        reviews_due:
          type: array
          items:
            type: object
            required: [node_id, title, due_at]
            properties:
              node_id: {type: string, format: uuid}
              title: {type: string}
              course: {$ref: "#/components/schemas/CourseRef"}
              due_at: {type: string, format: date-time}
        recommendations:
          type: array
          maxItems: 3
          items: {$ref: "#/components/schemas/Recommendation"}
        mastery:
          type: object
          required: [display]
          properties:
            display:
              type: string
              enum: [bars, narrative]
              description: "`narrative` when gamification.show_mastery_bars=false."
            courses:
              type: array
              items:
                type: object
                required: [course, counts]
                properties:
                  course: {$ref: "#/components/schemas/CourseRef"}
                  counts: {$ref: "#/components/schemas/LevelCounts"}
            narrative: {type: [string, "null"]}
        goals:
          type: array
          items: {$ref: "#/components/schemas/Goal"}
        grade_outlook:
          type: array
          description: Inputs for the client-side what-if projection. No LLM involved.
          items:
            type: object
            required: [course, current_percent, remaining_items]
            properties:
              course: {$ref: "#/components/schemas/CourseRef"}
              current_percent:
                type: [number, "null"]
                description: From committed grades only; null if none.
              graded_weight:
                type: [number, "null"]
                description: Fraction (0–1) of the course grade already committed.
              remaining_items:
                type: array
                items:
                  type: object
                  required: [assignment_id, title]
                  properties:
                    assignment_id: {type: string, format: uuid}
                    title: {type: string}
                    weight: {type: [number, "null"]}
                    points_possible: {type: [number, "null"]}
        calendar:
          type: array
          items: {$ref: "#/components/schemas/CalendarEvent"}
        unread_notifications: {type: integer, minimum: 0}

    ReviewQueueItem:
      type: object
      required: [kind, id, title, course, created_at]
      properties:
        kind: {type: string, enum: [feedback_release, grade_commit, credential_approval, attestation_override]}
        id:
          type: string
          description: Submission, grade, pending credential or attestation id, by kind.
        title: {type: string}
        course: {$ref: "#/components/schemas/CourseRef"}
        student_id: {type: [string, "null"], format: uuid}
        student_name: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        link: {type: [string, "null"]}

    AttentionSignal:
      type: object
      required: [kind, why, created_at]
      properties:
        kind: {type: string, enum: [review_flag, early_alert, stalled]}
        ai_action_id: {type: [string, "null"], format: uuid}
        why:
          type: array
          items: {$ref: "#/components/schemas/WhyItem"}
        created_at: {type: string, format: date-time}

    FacultyHome:
      type: object
      required: [role, review_queue, students_needing_attention, ai_review]
      properties:
        role: {type: string, const: faculty}
        review_queue:
          type: array
          items: {$ref: "#/components/schemas/ReviewQueueItem"}
        students_needing_attention:
          type: array
          items:
            type: object
            required: [student_id, display_name, course, signals]
            properties:
              student_id: {type: string, format: uuid}
              display_name: {type: string}
              course: {$ref: "#/components/schemas/CourseRef"}
              signals:
                type: array
                items: {$ref: "#/components/schemas/AttentionSignal"}
        ai_review:
          type: array
          description: Per own course.
          items:
            type: object
            required: [course, totals]
            properties:
              course: {$ref: "#/components/schemas/CourseRef"}
              totals: {$ref: "#/components/schemas/DecisionRates"}

    ProgramLeadHome:
      type: object
      required: [role, programs]
      properties:
        role: {type: string, const: program_lead}
        programs:
          type: array
          items:
            type: object
            required: [program_id, title, outcome_coverage]
            properties:
              program_id: {type: string, format: uuid}
              title: {type: string}
              courses:
                type: array
                items: {$ref: "#/components/schemas/CourseRef"}
              outcome_coverage:
                type: array
                items:
                  type: object
                  required: [program_outcome_id, title, counts]
                  properties:
                    program_outcome_id: {type: string, format: uuid}
                    title: {type: string}
                    counts: {$ref: "#/components/schemas/OutcomeStudentCounts"}
              ai_review: {$ref: "#/components/schemas/DecisionRates"}

    AdvisorHome:
      type: object
      required: [role, caseload]
      properties:
        role: {type: string, const: advisor}
        caseload:
          type: array
          items:
            type: object
            required: [student_id, display_name, courses, flags, upcoming_deadlines]
            properties:
              student_id: {type: string, format: uuid}
              display_name: {type: string}
              courses:
                type: array
                items:
                  type: object
                  required: [course, counts]
                  properties:
                    course: {$ref: "#/components/schemas/CourseRef"}
                    counts: {$ref: "#/components/schemas/LevelCounts"}
                    last_active: {type: [string, "null"], format: date-time}
              flags:
                type: array
                description: Subject to data.* policies.
                items: {$ref: "#/components/schemas/AttentionSignal"}
              upcoming_deadlines:
                type: array
                items: {$ref: "#/components/schemas/DueItem"}

    AdminHome:
      type: object
      required: [role, overview, compliance, ai_review]
      properties:
        role: {type: string, const: admin}
        overview:
          type: object
          properties:
            students: {type: integer}
            faculty: {type: integer}
            courses: {type: integer}
            programs: {type: integer}
            active_sessions_7d: {type: integer}
        compliance:
          type: object
          required: [mismatches_count]
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            mismatches_count: {type: integer}
        ai_review: {$ref: "#/components/schemas/DecisionRates"}
        pending_deletion_requests: {type: integer}

    # ---- provenance --------------------------------------------------------

    AiActionType:
      type: string
      enum: [generation, grade_draft, criterion_feedback, practice_item, recommendation,
             attestation, profile_update, nudge, alert]

    ProvenanceSource:
      type: object
      required: [type, id]
      properties:
        type: {type: string, enum: [content_item, node, submission, rubric, policy]}
        id: {type: string}
        version: {type: [integer, string, "null"]}
        title:
          type: [string, "null"]
          description: Display label resolved at read time.

    AppliedPolicy:
      type: object
      required: [key, value, scope_type]
      properties:
        key: {type: string}
        value: {}
        scope_type: {$ref: "#/components/schemas/PolicyScopeType"}
        scope_id: {type: [string, "null"], format: uuid}
        version: {type: [integer, "null"]}

    HumanDecisionValue:
      type: string
      enum: [accepted, edited, rejected, overridden, dismissed, disputed, snoozed]

    HumanDecision:
      type: object
      required: [id, ai_action_id, decided_by, decision, decided_at]
      properties:
        id: {type: string, format: uuid}
        ai_action_id: {type: string, format: uuid}
        decided_by: {type: string, format: uuid}
        decided_by_name: {type: [string, "null"]}
        decision: {$ref: "#/components/schemas/HumanDecisionValue"}
        diff:
          type: [object, "null"]
          description: Structured diff, e.g. per-criterion score deltas and text edit stats.
        reason: {type: [string, "null"]}
        decided_at: {type: string, format: date-time}

    OutcomeLink:
      type: object
      required: [ai_action_id, observed_at]
      properties:
        ai_action_id: {type: string, format: uuid}
        evidence_id: {type: [string, "null"], format: uuid}
        attestation_id: {type: [string, "null"], format: uuid}
        delta:
          type: [object, "null"]
          examples: [{criterion: thesis, before: 2, after: 3}]
        observed_at: {type: string, format: date-time}

    AiAction:
      description: Anything the software produced that a person could see or act on.
      type: object
      required: [id, agent, action_type, sources, policies, output, created_at, decisions]
      properties:
        id: {type: string, format: uuid}
        session_id: {type: [string, "null"], format: uuid}
        turn_id: {type: [string, "null"], format: uuid}
        agent: {type: string}
        action_type: {$ref: "#/components/schemas/AiActionType"}
        subject_person_id: {type: [string, "null"], format: uuid}
        course_id: {type: [string, "null"], format: uuid}
        target_type: {type: [string, "null"], examples: [grades]}
        target_id: {type: [string, "null"], format: uuid}
        sources:
          type: array
          items: {$ref: "#/components/schemas/ProvenanceSource"}
        policies:
          type: array
          items: {$ref: "#/components/schemas/AppliedPolicy"}
        model: {type: [string, "null"]}
        prompt_sha256: {type: [string, "null"]}
        output: {type: object}
        created_at: {type: string, format: date-time}
        decisions:
          type: array
          description: Oldest first.
          items: {$ref: "#/components/schemas/HumanDecision"}
        outcome_links:
          type: array
          items: {$ref: "#/components/schemas/OutcomeLink"}

    # ---- measurement -------------------------------------------------------

    DecisionRates:
      description: Counts and rates of human decisions on generated items. Rates are over decided items, 0–1.
      type: object
      required: [total, accepted, edited, rejected, undecided]
      properties:
        agent: {type: [string, "null"]}
        action_type:
          oneOf:
            - $ref: "#/components/schemas/AiActionType"
            - type: "null"
        total: {type: integer}
        accepted: {type: integer}
        edited: {type: integer}
        rejected: {type: integer}
        other:
          type: integer
          description: overridden, dismissed, disputed, snoozed.
        undecided: {type: integer}
        acceptance_rate: {type: [number, "null"]}
        edit_rate: {type: [number, "null"]}
        reject_rate: {type: [number, "null"]}

    DeltaStat:
      type: object
      required: [n]
      properties:
        n: {type: integer}
        mean_delta: {type: [number, "null"]}

    MeasurementSummary:
      type: object
      required: [scope, from, to, rates, criterion_score_changes, learning_delta_by_decision,
                 most_edited_criteria]
      properties:
        scope:
          type: object
          required: [type]
          properties:
            type: {type: string, enum: [course, program, institution]}
            id: {type: [string, "null"], format: uuid}
            title: {type: [string, "null"]}
        from: {type: [string, "null"], format: date-time}
        to: {type: string, format: date-time}
        rates:
          type: array
          description: One row per (agent, action_type).
          items: {$ref: "#/components/schemas/DecisionRates"}
        criterion_score_changes:
          type: array
          description: Mean instructor change to AI-drafted criterion scores.
          items:
            type: object
            required: [criterion_id, criterion_key, n, mean_delta]
            properties:
              criterion_id: {type: string, format: uuid}
              criterion_key: {type: string}
              n: {type: integer}
              mean_delta: {type: number}
        learning_delta_by_decision:
          type: object
          required: [accepted, edited, rejected]
          properties:
            accepted: {$ref: "#/components/schemas/DeltaStat"}
            edited: {$ref: "#/components/schemas/DeltaStat"}
            rejected: {$ref: "#/components/schemas/DeltaStat"}
        most_edited_criteria:
          type: array
          items:
            type: object
            required: [criterion_id, criterion_key, edit_count, edit_rate]
            properties:
              criterion_id: {type: string, format: uuid}
              criterion_key: {type: string}
              edit_count: {type: integer}
              edit_rate: {type: number}
        offloading:
          type: object
          description: §13.2 metrics.
          properties:
            hint_dependency_ratio: {type: [number, "null"]}
            solution_check_trips: {type: integer}

    MeasurementRollup:
      allOf:
        - $ref: "#/components/schemas/MeasurementSummary"
        - type: object
          required: [per_course, compliance]
          properties:
            per_course:
              type: array
              items:
                type: object
                required: [course, totals]
                properties:
                  course: {$ref: "#/components/schemas/CourseRef"}
                  totals: {$ref: "#/components/schemas/DecisionRates"}
            compliance:
              type: object
              required: [mismatches_count]
              properties:
                mismatches_count: {type: integer}

    MeasurementExport:
      type: object
      required: [course_id, from, to, ai_actions, human_decisions, outcome_links]
      properties:
        course_id: {type: string, format: uuid}
        from: {type: [string, "null"], format: date-time}
        to: {type: string, format: date-time}
        generated_at: {type: string, format: date-time}
        ai_actions:
          type: array
          items: {$ref: "#/components/schemas/AiAction"}
        human_decisions:
          type: array
          items: {$ref: "#/components/schemas/HumanDecision"}
        outcome_links:
          type: array
          items: {$ref: "#/components/schemas/OutcomeLink"}

    # ---- policy ------------------------------------------------------------

    PolicyScopeType:
      type: string
      enum: [vendor_default, institution, program, course, learner]

    WritablePolicyScope:
      type: string
      enum: [institution, program, course, learner]

    PolicySource:
      type: object
      required: [scope_type]
      properties:
        scope_type: {$ref: "#/components/schemas/PolicyScopeType"}
        scope_id: {type: [string, "null"], format: uuid}
        scope_title: {type: [string, "null"]}
        version: {type: [integer, "null"]}
        set_by: {type: [string, "null"], format: uuid}
        set_by_name: {type: [string, "null"]}
        effective_from: {type: [string, "null"], format: date-time}
        rationale: {type: [string, "null"]}

    PolicyChainEntry:
      allOf:
        - $ref: "#/components/schemas/PolicySource"
        - type: object
          required: [outcome]
          properties:
            value: {}
            locked: {type: boolean}
            outcome:
              type: string
              enum: [winner, overridden, overridden_by_lock, not_stricter, not_set]
              description: |
                What the resolver did with this scope. `not_stricter` = a learner
                value rejected by the learner_may_tighten rule.

    PolicyDefinition:
      description: Registry entry for a key.
      type: object
      required: [key, schema, allowed_scopes, enforced_in, description]
      properties:
        key: {type: string}
        schema:
          type: object
          description: JSON Schema for the value.
        default: {}
        allowed_scopes:
          type: array
          items: {$ref: "#/components/schemas/WritablePolicyScope"}
        learner_may_tighten: {type: boolean}
        enforced_in:
          type: array
          items: {type: string, enum: [code, prompt, ui]}
        description: {type: string}

    PolicyResolved:
      type: object
      required: [key, value, source, chain, locked]
      properties:
        key: {type: string}
        value: {}
        source: {$ref: "#/components/schemas/PolicySource"}
        chain:
          type: array
          description: Every scope considered, in precedence order.
          items: {$ref: "#/components/schemas/PolicyChainEntry"}
        locked:
          type: boolean
          description: True when the winning value comes from a locked scope.
        conflicts:
          type: array
          description: Conflicting program values for a course in several programs; the most restrictive won.
          items: {$ref: "#/components/schemas/PolicyChainEntry"}
        editable:
          type: boolean
          description: Whether the caller may set this key at editable_scope now.
        editable_scope:
          oneOf:
            - $ref: "#/components/schemas/WritablePolicyScope"
            - type: "null"
        definition: {$ref: "#/components/schemas/PolicyDefinition"}

    PolicySetting:
      description: One policy_settings row.
      type: object
      required: [id, key, scope_type, value, locked, version, effective_from]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        scope_type: {$ref: "#/components/schemas/PolicyScopeType"}
        scope_id: {type: [string, "null"], format: uuid}
        value: {}
        locked: {type: boolean}
        rationale: {type: [string, "null"]}
        version: {type: integer}
        set_by: {type: [string, "null"], format: uuid}
        set_by_name: {type: [string, "null"]}
        effective_from: {type: string, format: date-time}
        superseded_at: {type: [string, "null"], format: date-time}

    PolicyPrecedence:
      type: object
      required: [order_list, per_key]
      properties:
        order_list:
          type: array
          items: {$ref: "#/components/schemas/PolicyScopeType"}
          examples: [[institution, program, course, learner, vendor_default]]
        per_key:
          type: object
          additionalProperties:
            type: array
            items: {$ref: "#/components/schemas/PolicyScopeType"}
        set_by: {type: [string, "null"], format: uuid}
        updated_at: {type: [string, "null"], format: date-time}

    PolicyPreset:
      type: object
      required: [id, name, description, settings]
      properties:
        id: {type: string, examples: [conference]}
        name: {type: string, examples: [Conference / Narrative]}
        description: {type: string}
        settings:
          type: array
          items:
            type: object
            required: [key, value]
            properties:
              key: {type: string}
              value: {}
              locked: {type: boolean, default: false}

    ComplianceReport:
      type: object
      required: [scope, from, to, actions_checked, mismatches_count, mismatches, denied_policy_events]
      properties:
        scope:
          type: object
          required: [type]
          properties:
            type: {type: string, enum: [program, institution]}
            id: {type: [string, "null"], format: uuid}
        from: {type: [string, "null"], format: date-time}
        to: {type: string, format: date-time}
        actions_checked: {type: integer}
        mismatches_count: {type: integer}
        mismatches:
          type: array
          items:
            type: object
            required: [ai_action_id, key, recorded_value, effective_value, created_at]
            properties:
              ai_action_id: {type: string, format: uuid}
              key: {type: string}
              recorded_value: {}
              effective_value: {}
              effective_source: {$ref: "#/components/schemas/PolicySource"}
              created_at: {type: string, format: date-time}
        denied_policy_events:
          type: array
          description: tool_calls rows with outcome `denied_policy`.
          items:
            type: object
            required: [tool_call_id, agent, tool, created_at]
            properties:
              tool_call_id: {type: integer}
              turn_id: {type: [string, "null"], format: uuid}
              agent: {type: string}
              tool: {type: string}
              created_at: {type: string, format: date-time}

    # ---- assessment --------------------------------------------------------

    SubmissionStatus:
      type: string
      enum: [draft, final]

    Submission:
      type: object
      required: [id, person_id, assignment_id, version, status, submitted_at]
      properties:
        id: {type: string, format: uuid}
        person_id: {type: string, format: uuid}
        assignment_id: {type: string, format: uuid}
        course_id: {type: [string, "null"], format: uuid}
        version: {type: integer, minimum: 1}
        parent_id: {type: [string, "null"], format: uuid}
        status: {$ref: "#/components/schemas/SubmissionStatus"}
        body_md: {type: [string, "null"]}
        attachments:
          type: array
          items: {type: object}
        submitted_at: {type: string, format: date-time}
        feedback_status: {$ref: "#/components/schemas/FeedbackStatus"}

    FeedbackStatus:
      type: string
      enum: [pending, awaiting_release, released, suppressed, none]
      description: "`none` for finals, which get a grade draft instead of formative feedback."

    EvidenceSpan:
      type: object
      required: [quote]
      properties:
        quote: {type: string}
        start:
          type: [integer, "null"]
          description: Character offset in body_md.
        end: {type: [integer, "null"]}

    CriterionFeedback:
      type: object
      required: [criterion_id, criterion_key, description, ai_score, evidence_spans]
      properties:
        criterion_id: {type: string, format: uuid}
        criterion_key: {type: string, examples: [evidence]}
        description: {type: string}
        ai_score:
          type: [integer, "null"]
          description: Null to the student on drafts when feedback.show_scores_on_drafts=false.
        level_label:
          type: [string, "null"]
          examples: [Developing]
        ai_rationale: {type: [string, "null"]}
        evidence_spans:
          type: array
          items: {$ref: "#/components/schemas/EvidenceSpan"}
        next_step: {type: [string, "null"]}
        final_score:
          type: [integer, "null"]
          description: Instructor-confirmed score (finals only).
        ai_action_id: {type: [string, "null"], format: uuid}
        released_at: {type: [string, "null"], format: date-time}

    SubmissionFeedback:
      type: object
      required: [submission_id, status, release_mode, criteria]
      properties:
        submission_id: {type: string, format: uuid}
        assignment_id: {type: string, format: uuid}
        person_id: {type: string, format: uuid}
        student_name: {type: [string, "null"]}
        status: {$ref: "#/components/schemas/FeedbackStatus"}
        release_mode:
          type: string
          enum: [auto, instructor_release]
          description: Resolved feedback.release_mode.
        criteria:
          type: array
          items: {$ref: "#/components/schemas/CriterionFeedback"}
        practice_set_ai_action_id:
          type: [string, "null"]
          format: uuid
          description: Practice generated for a detected weakness, if any ("Practice for this").

    Improvement:
      type: object
      required: [course_id, criteria, students]
      properties:
        course_id: {type: string, format: uuid}
        criteria:
          type: array
          items:
            type: object
            required: [criterion_id, criterion_key, description]
            properties:
              criterion_id: {type: string, format: uuid}
              criterion_key: {type: string}
              description: {type: string}
              target_score: {type: [integer, "null"]}
        students:
          type: array
          description: Empty for aggregate-only callers (program_lead, admin).
          items:
            type: object
            required: [student_id, display_name, trajectories]
            properties:
              student_id: {type: string, format: uuid}
              display_name: {type: string}
              trajectories:
                type: array
                items: {$ref: "#/components/schemas/CriterionTrajectory"}
        aggregate:
          type: array
          description: Per criterion, across students.
          items:
            type: object
            required: [criterion_id, n_students, flag_counts]
            properties:
              criterion_id: {type: string, format: uuid}
              n_students: {type: integer}
              mean_delta: {type: [number, "null"]}
              flag_counts:
                type: object
                additionalProperties: {type: integer}

    CriterionTrajectory:
      type: object
      required: [criterion_id, points, flag]
      properties:
        criterion_id: {type: string, format: uuid}
        points:
          type: array
          description: One per submission version, oldest first.
          items:
            type: object
            required: [submission_id, version, status, score, submitted_at]
            properties:
              submission_id: {type: string, format: uuid}
              version: {type: integer}
              status: {$ref: "#/components/schemas/SubmissionStatus"}
              score: {type: [integer, "null"]}
              submitted_at: {type: string, format: date-time}
        latest_delta: {type: [integer, "null"]}
        flag:
          type: [string, "null"]
          enum: [improving, plateaued, regressed, ready_for_summative, null]

    # ---- record ------------------------------------------------------------

    OutcomeStudentCounts:
      type: object
      required: [mastery, proficient, emerging, no_evidence]
      properties:
        mastery: {type: integer}
        proficient: {type: integer}
        emerging: {type: integer}
        no_evidence: {type: integer}

    OutcomesReport:
      type: object
      required: [program, generated_at, outcomes]
      properties:
        program:
          type: object
          required: [id, title]
          properties:
            id: {type: string, format: uuid}
            title: {type: string}
        cohort: {type: [string, "null"]}
        generated_at: {type: string, format: date-time}
        partial:
          type: boolean
          description: True when limited to the caller's own courses (faculty slice).
        outcomes:
          type: array
          items:
            type: object
            required: [program_outcome_id, title, supporting_outcomes, students,
                       criterion_distributions, evidence_count, sample_artifacts]
            properties:
              program_outcome_id: {type: string, format: uuid}
              title: {type: string}
              description: {type: [string, "null"]}
              supporting_outcomes:
                type: array
                items:
                  type: object
                  required: [outcome_id, title, course]
                  properties:
                    outcome_id: {type: string, format: uuid}
                    title: {type: string}
                    course: {$ref: "#/components/schemas/CourseRef"}
              students:
                description: How well — students by highest attested level.
                $ref: "#/components/schemas/OutcomeStudentCounts"
              criterion_distributions:
                type: array
                description: What they can do — committed scores on aligned rubric criteria.
                items:
                  type: object
                  required: [criterion_id, criterion_key, course, distribution]
                  properties:
                    criterion_id: {type: string, format: uuid}
                    criterion_key: {type: string}
                    course: {$ref: "#/components/schemas/CourseRef"}
                    distribution:
                      type: object
                      description: Score → student count.
                      additionalProperties: {type: integer}
              evidence_count: {type: integer}
              sample_artifacts:
                type: array
                items:
                  type: object
                  required: [type, id]
                  properties:
                    type: {type: string, enum: [submission, attestation, credential]}
                    id: {type: string, format: uuid}
                    title: {type: [string, "null"]}
                    link: {type: [string, "null"]}

    VerifyResult:
      type: object
      required: [valid, signature_valid, revoked, checks]
      properties:
        valid:
          type: boolean
          description: True only if every check passed.
        signature_valid: {type: boolean}
        proof_format:
          type: [string, "null"]
          enum: [eddsa-rdfc-2022, vc-jwt, null]
        credential_id: {type: [string, "null"]}
        issuer:
          type: [object, "null"]
          properties:
            id: {type: string, description: "Issuer did:key."}
            name: {type: [string, "null"]}
            url: {type: [string, "null"]}
        revoked: {type: boolean}
        revoked_at: {type: [string, "null"], format: date-time}
        revocation_reason: {type: [string, "null"]}
        checks:
          type: array
          items:
            type: object
            required: [check, passed]
            properties:
              check: {type: string, examples: [signature, issuer_known, not_revoked, not_expired, schema]}
              passed: {type: boolean}
              message: {type: [string, "null"]}

    ClrDocument:
      description: |
        Opaque here: a signed 1EdTech Comprehensive Learner Record 2.0 JSON-LD
        document (ClrCredential), validated against the 1EdTech CLR 2.0 JSON
        schema in CI. See https://www.imsglobal.org/spec/clr/v2p0/. Contains
        achievements, evidence references (never `private` evidence) and
        associations to program outcomes; signed with the §11.4 key.
      type: object
      additionalProperties: true

    # ---- privacy -----------------------------------------------------------

    AccessLogEntry:
      type: object
      required: [actor_id, resource, purpose, created_at]
      properties:
        actor_id: {type: string, format: uuid}
        actor_name: {type: [string, "null"]}
        actor_role: {type: [string, "null"]}
        resource: {type: string, examples: [transcript]}
        resource_id: {type: [string, "null"]}
        purpose: {type: string}
        created_at: {type: string, format: date-time}

    DeletionRequestStatus:
      type: string
      enum: [pending, approved, rejected, completed]

    DeletionRequest:
      type: object
      required: [id, person_id, status, requested_at]
      properties:
        id: {type: string, format: uuid}
        person_id: {type: string, format: uuid}
        person_name: {type: [string, "null"]}
        status: {$ref: "#/components/schemas/DeletionRequestStatus"}
        reason: {type: [string, "null"]}
        requested_at: {type: string, format: date-time}
        decided_by: {type: [string, "null"], format: uuid}
        decided_at: {type: [string, "null"], format: date-time}
        decision_reason: {type: [string, "null"]}
        completed_at: {type: [string, "null"], format: date-time}

    MyData:
      type: object
      required: [person, profile, analyst_summaries, insights, goals, flags, flags_visible,
                 ai_actions, access_log, deletion_request]
      properties:
        person:
          type: object
          required: [id, display_name]
          properties:
            id: {type: string, format: uuid}
            display_name: {type: string}
            email: {type: [string, "null"]}
        profile:
          type: object
          required: [text, disputed_statements]
          properties:
            text:
              type: [string, "null"]
              description: persons.attributes.learner_profile.
            disputed_statements:
              type: array
              items:
                type: object
                required: [statement, disputed_at]
                properties:
                  statement: {type: string}
                  reason: {type: [string, "null"]}
                  disputed_at: {type: string, format: date-time}
        analyst_summaries:
          type: array
          items:
            type: object
            required: [session_id, summary, created_at]
            properties:
              session_id: {type: string}
              course: {$ref: "#/components/schemas/CourseRef"}
              summary: {type: string}
              created_at: {type: string, format: date-time}
        insights: {type: array, items: {}}
        goals:
          type: array
          items: {$ref: "#/components/schemas/Goal"}
        flags_visible:
          type: boolean
          description: Resolved data.flags_visible_to_learner.
        flags:
          type: array
          description: Empty when flags_visible is false.
          items: {$ref: "#/components/schemas/AttentionSignal"}
        ai_actions:
          type: array
          description: Most recent 50 about the caller; page further with GET /api/ai-actions.
          items: {$ref: "#/components/schemas/AiAction"}
        access_log:
          type: array
          description: Who accessed my data (non-self reads), newest first.
          items: {$ref: "#/components/schemas/AccessLogEntry"}
        deletion_request:
          oneOf:
            - $ref: "#/components/schemas/DeletionRequest"
            - type: "null"

    MyDataExport:
      description: MyData plus the full underlying records. Additional sections may be added.
      allOf:
        - $ref: "#/components/schemas/MyData"
        - type: object
          required: [exported_at]
          properties:
            exported_at: {type: string, format: date-time}
            enrollments:
              type: array
              items: {$ref: "#/components/schemas/Enrollment"}
            sessions:
              type: array
              description: Sessions with transcript turns (text "[purged]" past retention).
              items: {type: object}
            submissions:
              type: array
              items: {$ref: "#/components/schemas/Submission"}
            evidence:
              type: array
              description: Includes private evidence.
              items: {type: object}
            attestations: {type: array, items: {type: object}}
            grades: {type: array, items: {type: object}}
            issued_credentials: {type: array, items: {type: object}}
            notifications:
              type: array
              items: {$ref: "#/components/schemas/Notification"}
            policy_preferences:
              type: array
              items: {$ref: "#/components/schemas/PolicySetting"}

    # ---- notifications -----------------------------------------------------

    Notification:
      type: object
      required: [id, kind, title, created_at]
      properties:
        id: {type: string, format: uuid}
        kind:
          type: string
          examples: [review_due, deadline, stalled_student, feedback_ready, alert]
        title: {type: string}
        body: {type: [string, "null"]}
        link: {type: [string, "null"]}
        ai_action_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
        read_at: {type: [string, "null"], format: date-time}
        dismissed_at: {type: [string, "null"], format: date-time}

    # ---- study -------------------------------------------------------------

    Flashcard:
      type: object
      required: [id, front, back, node_id]
      properties:
        id:
          type: string
          description: Stable within the deck.
        front: {type: string}
        back: {type: string}
        source_span:
          type: [string, "null"]
          description: Quoted span of the reading the card was generated from.
        node_id: {type: string, format: uuid}

    FlashcardDeckSummary:
      type: object
      required: [id, title, course_id, card_count, created_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        course_id: {type: string, format: uuid}
        source:
          type: [object, "null"]
          description: '"Generated from: <reading title>".'
          properties:
            content_item_id: {type: string, format: uuid}
            title: {type: string}
        card_count: {type: integer}
        author_id: {type: [string, "null"], format: uuid}
        ai_action_id: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}

    FlashcardDeck:
      allOf:
        - $ref: "#/components/schemas/FlashcardDeckSummary"
        - type: object
          required: [cards]
          properties:
            cards:
              type: array
              items: {$ref: "#/components/schemas/Flashcard"}

    ReviewSchedule:
      type: object
      required: [node_id, due_at, interval_days, ease, reps, lapses]
      properties:
        node_id: {type: string, format: uuid}
        due_at: {type: string, format: date-time}
        interval_days: {type: number}
        ease: {type: number}
        reps: {type: integer}
        lapses: {type: integer}

    # ---- existing ----------------------------------------------------------

    MasteryLevel:
      type: string
      enum: [emerging, proficient, mastery]

    MasteryMap:
      type: object
      required: [student_name, course_title, microcredentials, summary]
      properties:
        student_name: {type: string}
        course_title: {type: string}
        microcredentials:
          type: array
          items:
            type: object
            required: [id, title, earned, progress, total_concepts, modules]
            properties:
              id: {type: string, format: uuid}
              title: {type: string}
              earned:
                type: boolean
                description: True when every concept is at mastery.
              progress: {$ref: "#/components/schemas/LevelCounts"}
              total_concepts: {type: integer}
              modules:
                type: array
                items:
                  type: object
                  required: [id, title, concepts]
                  properties:
                    id: {type: string, format: uuid}
                    title: {type: string}
                    concepts:
                      type: array
                      items:
                        type: object
                        required: [id, title, level]
                        properties:
                          id: {type: string, format: uuid}
                          title: {type: string}
                          level:
                            type: string
                            enum: [not_started, emerging, proficient, mastery]
        summary:
          allOf:
            - $ref: "#/components/schemas/LevelCounts"
            - type: object
              required: [total_concepts, microcredentials_earned, microcredentials_total]
              properties:
                total_concepts: {type: integer}
                microcredentials_earned: {type: integer}
                microcredentials_total: {type: integer}

    LevelCounts:
      type: object
      required: [mastery, proficient, emerging, not_started]
      properties:
        mastery: {type: integer}
        proficient: {type: integer}
        emerging: {type: integer}
        not_started: {type: integer}

    SessionSummary:
      type: object
      required: [session_id, course_id, course_title, created_at, turn_count, first_message]
      properties:
        session_id: {type: string, format: uuid}
        course_id: {type: [string, "null"], format: uuid}
        course_title: {type: string}
        created_at: {type: string, format: date-time}
        turn_count: {type: integer}
        first_message:
          type: string
          description: First user message, truncated to 100 characters.

    ReviewerBody:
      type: object
      required: [reviewer_id]
      properties:
        reviewer_id:
          type: string
          format: uuid
          description: persons.id of the approving instructor; must equal the caller.

    ApproveResult:
      type: object
      required: [approved, credential_id]
      properties:
        approved: {type: boolean, const: true}
        credential_id:
          type: string
          format: uuid
          description: Id embedded in the OB3 credential (`urn:uuid:<id>`).

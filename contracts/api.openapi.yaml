        "200":
          description: ok
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MyDataExport"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/me/deletion-request:
    post:
      tags: [privacy]
      summary: Request deletion of the caller's personal data
      operationId: requestDeletion
      x-implementation-status: planned
      x-task: T-E-124
      x-required-capability: my_data
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Queued for admin approval. On approval, conversation content and the
        learner profile are purged; committed grades and issued credentials
        are kept as institutional records.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: [string, "null"]}

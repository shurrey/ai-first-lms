openapi: 3.1.0
info:
  title: AI-First LMS Prototype — Orchestrator API
  version: 0.3.0
  description: |
    Contract between the frontends and the orchestrator. Source of truth.
    Do not edit without a T-C-* contract-change task.

    The frontends call only these endpoints. Sub-agents and MCP servers are
    NOT exposed through this API.

    Error convention for the data-backed read/write endpoints (/api/mastery,
    /api/roster, /api/student*, /api/transcript, credential and settings
    endpoints): they proxy an MCP tool and return its JSON as-is. A tool-level
    failure (unknown id, missing argument, MCP server unreachable) is returned
    as HTTP 200 with body `{"error": "<message>"}`, not as a 4xx/5xx. Callers
    must check for the `error` key. Request-body validation failures are 422.
    Endpoints marked `x-implementation-status: planned` use ordinary HTTP
    status codes (4xx/5xx with an ErrorDetail body) instead.

    Authentication (spec.md §4.4). Sign in with POST /api/auth/login, which
    sets two cookies:
      - `lms_session`: opaque session token. HttpOnly; SameSite=Lax; Path=/;
        Secure when COOKIE_SECURE=true; Max-Age = SESSION_TTL_HOURS * 3600
        (default 12 h). Sliding expiry: each authenticated request may extend it.
      - `lms_csrf`: the session's CSRF token. NOT HttpOnly (the UI reads it);
        SameSite=Lax; Path=/; same Secure and Max-Age as `lms_session`.
    Cookies are host-scoped, not port-scoped, so one login is shared by both
    UIs on localhost. Clients send `credentials: "include"` on fetch and
    `{withCredentials: true}` on EventSource.

    CSRF (double-submit): every non-GET request under /api/* except
    POST /api/auth/login must carry header `X-CSRF-Token` equal to the
    `lms_csrf` cookie value. Missing or mismatched returns 403.

    Authorization. `x-required-capability` names the /api/auth/me
    `capabilities` key (§17) an operation needs; `public` means no session,
    `authenticated` means any signed-in person. Operations about one learner
    always admit that learner themself; `x-scope-check` names the
    object-level check (`scope.can_view_student(..., purpose=...)`, whose
    purpose is written to data_access_log). A missing or invalid session
    returns 401; a valid session without the capability or scope returns 403.

servers:
  - url: http://localhost:8000
    description: Local dev

x-auth-rollout: |
  Enforced by the live engine (T-E-101..T-E-104): every endpoint except
  /healthz and /api/auth/login requires a session cookie, non-GET /api/*
  requests require X-CSRF-Token, and the x-scope-check annotations are
  applied server-side.

security:
  - sessionCookie: []

tags:
  - name: core
    description: Session, conversation turn, streaming and approval flow
  - name: auth
    description: Sign-in, session cookie, role switching and the /me payload
  - name: home
    description: Role-specific home payloads
  - name: roster
    description: Faculty / advisor roster, mastery and transcript views
  - name: assessment
    description: Submissions, criterion feedback and improvement trajectories
  - name: provenance
    description: Record of what the software generated and what people did with it
  - name: measurement
    description: AI Review metrics and evaluator export
  - name: policy
    description: Governance policy resolution, editing, precedence and presets
  - name: credentials
    description: Microcredential review, issuance, verification and system settings
  - name: record
    description: Program outcome reports and the Comprehensive Learner Record
  - name: privacy
    description: The learner's own data, disputes, export and deletion
  - name: notifications
    description: In-app notifications
  - name: study
    description: Flashcards and other study aids
  - name: podcast
    description: Personalized audio lesson generation

paths:
  /healthz:
    get:
      tags: [core]
      summary: Liveness probe
      operationId: healthz
      security: []
      x-required-capability: public
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, const: ok}

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  /api/auth/login:
    post:
      tags: [auth]
      summary: Sign in with username and password
      operationId: login
      x-task: T-E-102
      security: []
      x-required-capability: public
      description: |
        Exempt from the session cookie and from X-CSRF-Token. On success,
        creates an auth_sessions row with `active_role` = the person's first
        role, sets `lms_session` and `lms_csrf` (attributes in info.description),
        and returns the /me payload.

        Every failure (unknown username, wrong password, locked account)
        returns the same 401 body, `{"detail": "Invalid username or password."}`.
        After LOGIN_MAX_ATTEMPTS (default 5) consecutive failures the account
        is locked for LOGIN_LOCKOUT_MINUTES (default 5); the response never
        reveals the lock or whether the username exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Signed in. Both cookies are set.
          headers:
            Set-Cookie:
              description: |
                Two Set-Cookie headers are sent, e.g.
                `lms_session=<token>; HttpOnly; SameSite=Lax; Path=/; Max-Age=43200`
                and `lms_csrf=<csrf>; SameSite=Lax; Path=/; Max-Age=43200`
                (plus `Secure` when COOKIE_SECURE=true).
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401":
          description: Generic failure. Body detail is always "Invalid username or password."
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session and clear both cookies
      operationId: logout
      x-task: T-E-102
      security:
        - sessionCookie: []
          csrfHeader: []
      x-required-capability: authenticated
      description: |
        A missing, expired or revoked session also returns 204 with both
        cookies cleared. A live session still needs a matching X-CSRF-Token
        (403 otherwise).

        Change: T-C-109 — documents the no-session 204; no behavior change.
      responses:
        "204":
          description: Session revoked; `lms_session` and `lms_csrf` cleared with Max-Age=0.
          headers:
            Set-Cookie:
              description: Two clearing Set-Cookie headers (`lms_session=; Max-Age=0`, `lms_csrf=; Max-Age=0`).
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/auth/me:
    get:
      tags: [auth]
      summary: The signed-in person, roles, enrollments, capabilities and UI policy
      operationId: getMe
      x-task: T-E-102
      security:
        - sessionCookie: []
      x-required-capability: authenticated
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/auth/role:
    post:
      tags: [auth]
      summary: Switch the session's active role to another role the person holds
      operationId: switchRole
      x-task: T-E-102
      security:
        - sessionCookie: []
          csrfHeader: []
      x-required-capability: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: {$ref: "#/components/schemas/PersonRole"}
      responses:
        "200":
          description: Role switched; the /me payload for the new active role.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: The person does not hold this role, or CSRF failure.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /api/auth/password:
    post:
      tags: [auth]
      summary: Change own password
      operationId: changePassword
      x-task: T-E-102
      security:
        - sessionCookie: []
          csrfHeader: []
      x-required-capability: authenticated
      description: |
        Clears `credentials.must_change`. Other sessions of the same person are
        revoked; the calling session stays valid.

        Wrong current passwords count toward LOGIN_MAX_ATTEMPTS, shared with
        /api/auth/login. The attempt that trips the lockout revokes the calling
        session and returns 401 with both cookies cleared. While the account is
        locked, further attempts return 400.

        Change: T-C-109 — documents attempt counting and the 401 on the
        lock-tripping attempt; no status code, schema or behavior change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string}
                new_password: {type: string, minLength: 12}
      responses:
        "204": {description: Password changed}
        "400":
          description: current_password is wrong, or the account is locked. Wrong current passwords count toward LOGIN_MAX_ATTEMPTS.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          description: new_password shorter than 12 characters, or malformed body.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}

  # ---------------------------------------------------------------------------
  # Core
  # ---------------------------------------------------------------------------

  /api/session:
    post:
      tags: [core]
      summary: Create a session for the signed-in person and a course, and start its opening brief
      operationId: createSession
      x-change: T-C-102
      x-required-capability: authenticated
      x-scope-check: course_id must be a course the caller may act in (see description)
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Request body change (T-C-102): `persona` and `person_id` are removed.
        The persona is the session's `active_role` and the person is the
        authenticated person; either field, if sent, is ignored.

        `course_id` accepts a course UUID or a course node slug (`cs101`,
        `math201`, `eng102`, `bio150`, ...), or `all`. Slugs are resolved by a
        DB lookup and returned as `course_uuid`. The course must be one the
        caller may act in: enrolled for student/faculty, any course containing
        an assigned advisee for advisor, any course for admin. `all`
        (cross-course view) is allowed only for advisor and admin. Otherwise 403.

        A brief is generated in the background on turn `brief_turn_id`; open
        `stream_url` to receive it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [course_id]
              properties:
                course_id:
                  type: string
                  description: Course UUID, a course slug, or `all`.
                page:
                  type: [string, "null"]
                  description: |
                    Optional page context for the brief. Values used by the
                    Ultra UI: content, gradebook, roster, calendar, analytics.
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [session_id]
                properties:
                  session_id: {type: string}
                  person_id:
                    type: [string, "null"]
                    description: The authenticated person.
                  course_uuid:
                    type: [string, "null"]
                    description: Resolved course UUID, or `all`.
                  brief_turn_id:
                    type: [string, "null"]
                    description: Always `brief-<session_id>`.
                  stream_url:
                    type: [string, "null"]
                    description: Relative URL of the brief turn's SSE stream.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: Course not in the caller's scope, `all` requested by a role other than advisor/admin, or CSRF failure.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "404":
          description: Unknown course slug or UUID.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "422":
          description: Malformed body
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}

  /api/converse:
    post:
      tags: [core]
      summary: Submit a user message and begin a turn
      operationId: converse
      x-required-capability: authenticated
      x-scope-check: session belongs to the caller
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, message]
              properties:
                session_id: {type: string}
                message: {type: string}
                context_override:
                  type: [object, "null"]
                  description: Accepted but currently ignored by the orchestrator.
      responses:
        "202":
          description: |
            Turn accepted. Caller must open GET /api/stream for the returned
            turn_id to receive events.
          content:
            application/json:
              schema:
                type: object
                required: [turn_id, stream_url]
                properties:
                  turn_id: {type: string}
                  stream_url: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: Session not found (sessions are held in engine memory)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "422":
          description: Malformed body
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}

  /api/stream:
    get:
      tags: [core]
      summary: SSE stream of events for a turn
      operationId: stream
      x-required-capability: authenticated
      x-scope-check: session and turn belong to the caller
      security:
        - sessionCookie: []
      description: |
        Emits envelopes per contracts/events.md, then closes when the turn's
        status becomes `completed` or `error`. An unknown turn_id yields one
        `error` event (`code: internal`, "Turn not found") and closes.
        Each SSE message has `event:` set to the envelope's event type and
        `id:` set to its sequence number. Open with
        `new EventSource(url, {withCredentials: true})`; a session or turn
        that is not the caller's is rejected with 403 before streaming starts.
      parameters:
        - in: query
          name: session_id
          required: true
          schema: {type: string}
        - in: query
          name: turn_id
          required: true
          schema: {type: string}
        - in: query
          name: since_sequence
          required: false
          description: |
            Number of already-received events to skip, for reconnect. Pass the
            last received `sequence` value. Default 0 (replay from the start).
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: text/event-stream of envelopes per contracts/events.md.
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          description: Missing session_id or turn_id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}

  /api/approval:
    post:
      tags: [core]
      summary: Submit a human approval/edit/rejection for a pending step
      operationId: submitApproval
      x-required-capability: authenticated
      x-scope-check: session and turn belong to the caller
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, turn_id, approval_id, decision]
              properties:
                session_id: {type: string}
                turn_id: {type: string}
                approval_id: {type: string}
                decision: {type: string, enum: [approve, edit, reject]}
                edited_payload: {type: [object, "null"]}
                note: {type: [string, "null"]}
      responses:
        "202":
          description: accepted; orchestrator will resume the turn
          content:
            application/json:
              schema:
                type: object
                required: [status, approval_id, decision]
                properties:
                  status: {type: string, const: accepted}
                  approval_id: {type: string}
                  decision: {type: string, enum: [approve, edit, reject]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404":
          description: No pending approval with this approval_id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "422":
          description: Malformed body or unknown decision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}

  /api/clarify:
    post:
      tags: [core]
      summary: Answer a clarification request; resume the turn
      operationId: clarify
      x-implementation-status: not_implemented
      x-required-capability: authenticated
      x-scope-check: session and turn belong to the caller
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Not implemented in the engine. src/frontend/lib/api.ts calls it, and
        the request currently returns 404. Kept as designed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, turn_id, answer]
              properties:
                session_id: {type: string}
                turn_id: {type: string}
                answer: {type: string}
      responses:
        "202": {description: accepted}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/sessions/{session_id}/history:
    get:
      tags: [core]
      summary: Conversation history for a session
      operationId: getSessionHistory
      x-implementation-status: not_implemented
      x-required-capability: authenticated
      x-scope-check: session belongs to the caller
      security:
        - sessionCookie: []
      description: |
        Not implemented in the engine. src/frontend/lib/api.ts calls it, and
        the request currently returns 404. Kept as designed. The closest live
        endpoint is GET /api/transcript/{session_id}.
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  turns: {type: array, items: {type: object}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/sessions/{session_id}/end:
    post:
      tags: [core]
      summary: End a tutoring session (explicit End session button)
      operationId: endSession
      x-implementation-status: planned
      x-task: T-E-120
      x-required-capability: authenticated
      x-scope-check: session belongs to the caller
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Closes the session and queues the learning-analyst run. Policy
        `reflection.after_session` (resolved for the learner and course):
        `off` ignores `reflection`; `optional` stores it if given; `required`
        returns 409 until a non-empty reflection is sent. A stored reflection
        becomes an evidence row of kind `reflection`. Idempotent: ending an
        already-ended session returns 200 with the original `ended_at`.
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reflection:
                  type: [string, "null"]
                  description: Learner's end-of-session reflection (markdown).
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                required: [session_id, status, ended_at]
                properties:
                  session_id: {type: string}
                  status: {type: string, const: ended}
                  ended_at: {type: string, format: date-time}
                  reflection_evidence_id: {type: [string, "null"], format: uuid}
                  analyst_run_queued: {type: boolean}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Reflection required by policy and not supplied.
          content:
            application/json:
              schema:
                type: object
                required: [detail, reflection_required]
                properties:
                  detail: {type: string}
                  reflection_required: {type: boolean, const: true}
                  reflection_prompt:
                    type: string
                    description: Prompt text the UI shows above the reflection box.
        "422": {$ref: "#/components/responses/ValidationFailed"}

  # ---------------------------------------------------------------------------
  # Home (planned)
  # ---------------------------------------------------------------------------

  /api/home:
    get:
      tags: [home]
      summary: Home payload for the caller's active role
      operationId: getHome
      x-implementation-status: planned
      x-task: T-E-119
      x-required-capability: authenticated
      security:
        - sessionCookie: []
      description: |
        Composed server-side from MCP calls under the caller's scope. The shape
        is chosen by `active_role` and tagged by `role`. Student mastery is
        returned as `narrative` instead of counts when
        `gamification.show_mastery_bars=false`.
      parameters:
        - in: query
          name: compact
          required: false
          description: Return at most three items per list (Chat UI context pane).
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HomePayload"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  # ---------------------------------------------------------------------------
  # Roster, mastery, transcripts (existing)
  # ---------------------------------------------------------------------------

  /api/mastery/{person_id}/{course_id}:
    get:
      tags: [roster]
      summary: Live mastery map for a student in a course
      operationId: getMastery
      description: Proxies MCP tool `graph.mastery_map`.
      x-required-capability: mastery_matrix
      x-scope-check: scope.can_view_student(ctx, person_id, course_id, purpose="mastery")
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PersonIdPath"
        - $ref: "#/components/parameters/CourseIdPath"
      responses:
        "200":
          description: Mastery map, or `{error}`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MasteryMap"
                  - $ref: "#/components/schemas/ToolError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/roster/{course_id}:
    get:
      tags: [roster]
      summary: Students in a course with session activity, most recently active first
      operationId: getRoster
      description: "Authorization (§4.4): faculty of this course, or admin."
      x-required-capability: roster
      x-scope-check: caller is faculty of course_id, or admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [students, total]
                properties:
                  students:
                    type: array
                    items:
                      type: object
                      required: [id, name, session_count, last_active, total_turns]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        session_count: {type: integer}
                        last_active: {type: [string, "null"], format: date-time}
                        total_turns: {type: integer}
                  total: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/student/{person_id}/sessions:
    get:
      tags: [roster]
      summary: A student's tutoring sessions, newest first
      operationId: getStudentSessions
      x-required-capability: transcripts_of_others
      x-scope-check: scope.can_view_student(ctx, person_id, course_id, purpose="sessions")
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PersonIdPath"
        - in: query
          name: course_id
          required: false
          description: Limit to one course.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [student_name, sessions]
                properties:
                  student_name:
                    type: string
                    description: '"Unknown" if the person is not found.'
                  sessions:
                    type: array
                    items: {$ref: "#/components/schemas/SessionSummary"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/student/{person_id}/courses:
    get:
      tags: [roster]
      summary: Courses a student is enrolled in, with mastery and session summary
      operationId: getStudentCourses
      x-required-capability: mastery_matrix
      x-scope-check: scope.can_view_student(ctx, person_id, purpose="courses")
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PersonIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [student_name, courses]
                properties:
                  student_name: {type: string}
                  courses:
                    type: array
                    items:
                      type: object

                oneOf:
                  - type: object
                    required: [credentials]
                    properties:
                      credentials:
                        type: array
                        items:
                          type: object
                          required: [id, credential_title, course_title, issued_at, issued_by]
                          properties:
                            id: {type: string, format: uuid}
                            credential_title: {type: string}
                            course_title: {type: string}
                            issued_at: {type: string, format: date-time}
                            issued_by:
                              type: string
                              description: Reviewer display name.
                  - $ref: "#/components/schemas/ToolError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/settings:
    get:
      tags: [credentials]
      summary: Read system settings
      operationId: getSettings
      description: "Proxies MCP tool `assessments.get_settings`. Authorization (§4.4): admin only."
      x-required-capability: system_settings
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: key
          required: false
          description: Return one setting instead of all.
          schema: {type: string}
      responses:
        "200":
          description: |
            With `key`: `{key, value}` (value null if unset). Without: `{settings}`
            mapping each key to its JSON value.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [key, value]
                    properties:
                      key: {type: string}
                      value: {}
                  - type: object
                    required: [settings]
                    properties:
                      settings:
                        type: object
                        additionalProperties: {}
                  - $ref: "#/components/schemas/ToolError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [credentials]
      summary: Create or replace one system setting
      operationId: saveSetting
      description: "Proxies MCP tool `assessments.save_settings`. A null value is rejected. Authorization (§4.4): admin only."
      x-required-capability: system_settings
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: {type: string}
                value:
                  description: Any JSON value; stored in system_settings.value (jsonb).
      responses:
        "200":
          description: Saved, or `{error}`
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [saved]
                    properties:
                      saved: {type: boolean, const: true}
                  - $ref: "#/components/schemas/ToolError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          description: Malformed body
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}


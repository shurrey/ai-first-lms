  # ---------------------------------------------------------------------------
  # Credentials (existing + verify)
  # ---------------------------------------------------------------------------

  /api/pending-credentials/{course_id}:
    get:
      tags: [credentials]
      summary: Pending microcredentials awaiting instructor review in a course
      operationId: getPendingCredentials
      description: "Proxies MCP tool `assessments.list_pending_credentials`. Authorization (§4.4): faculty of this course, or admin."
      x-required-capability: badge_approve
      x-scope-check: caller is faculty of course_id, or admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CourseIdPath"
        - in: query
          name: person_id
          required: false
          description: Limit to one student.
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Pending list, or `{error}`
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [pending]
                    properties:
                      pending:
                        type: array
                        items:
                          type: object
                          required: [id, person_id, student_name, microcredential_id,
                                     credential_title, created_at]
                          properties:
                            id: {type: string, format: uuid}
                            person_id: {type: string, format: uuid}
                            student_name: {type: string}
                            microcredential_id: {type: string, format: uuid}
                            credential_title: {type: string}
                            created_at: {type: string, format: date-time}
                  - $ref: "#/components/schemas/ToolError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/credential-evidence/{pending_id}:
    get:
      tags: [credentials]
      summary: Evidence for a pending microcredential
      operationId: getCredentialEvidence
      description: Proxies MCP tool `assessments.get_credential_evidence`.
      x-required-capability: badge_approve
      x-scope-check: caller is faculty of the pending credential's course, or admin
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PendingIdPath"
      responses:
        "200":
          description: Evidence, or `{error}`
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [pending_id, student_name, credential_title, created_at,
                               session_count, concepts]
                    properties:
                      pending_id: {type: string, format: uuid}
                      student_name: {type: string}
                      credential_title: {type: string}
                      created_at: {type: string, format: date-time}
                      session_count: {type: integer}
                      concepts:
                        type: array
                        items:
                          type: object
                          required: [id, title, level, attested_at]
                          properties:
                            id: {type: string, format: uuid}
                            title: {type: string}
                            level:
                              oneOf:
                                - $ref: "#/components/schemas/MasteryLevel"
                                - type: "null"
                            attested_at: {type: [string, "null"], format: date-time}
                  - $ref: "#/components/schemas/ToolError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/approve-credential/{pending_id}:
    post:
      tags: [credentials]
      summary: Approve a pending microcredential and issue an Open Badges 3.0 credential
      operationId: approveCredential
      description: |
        Proxies MCP tool `assessments.approve_credential`. Does not go through
        the approval_request / POST /api/approval gate; the click is the approval.
        `reviewer_id` must equal the authenticated person (403 otherwise).
      x-required-capability: badge_approve
      x-scope-check: caller is faculty of the pending credential's course, or admin
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/PendingIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReviewerBody"}
      responses:
        "200":
          description: Approved, or `{error}` (not found / already processed)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApproveResult"
                  - $ref: "#/components/schemas/ToolError"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          description: Missing reviewer_id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}

  /api/approve-credentials/bulk:
    post:
      tags: [credentials]
      summary: Approve several pending microcredentials
      operationId: bulkApproveCredentials
      description: |
        Calls `assessments.approve_credential` once per id, sequentially. Each
        result is reported independently; one failure does not stop the rest.
        A pending id outside the caller's courses is reported as a per-item
        error. `reviewer_id` must equal the authenticated person (403 otherwise).
      x-required-capability: badge_approve
      x-scope-check: per pending id, caller is faculty of its course, or admin
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ReviewerBody"
                - type: object
                  required: [pending_ids]
                  properties:
                    pending_ids:
                      type: array
                      items: {type: string, format: uuid}
      responses:
        "200":
          description: One result per pending_id, in request order
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [pending_id]
                      properties:
                        pending_id: {type: string}
                        approved: {type: boolean}
                        credential_id: {type: string, format: uuid}
                        error: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422":
          description: Malformed body
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationError"}

  /api/credentials/verify:
    post:
      tags: [credentials]
      summary: Verify a signed credential's signature, issuer and revocation status
      operationId: verifyCredential
      x-implementation-status: planned
      x-task: T-E-122
      x-required-capability: authenticated
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Spec §11.4 says GET; POST is used because the input is a full credential
        document. An invalid or tampered credential is a 200 with `valid: false`;
        422 only when the body is not a credential at all.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  description: OB 3.0 credential as JSON-LD (Data Integrity proof) or a VC-JWT compact string.
                  oneOf:
                    - type: object
                    - type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /api/credentials/{person_id}:
    get:
      tags: [credentials]
      summary: Issued credentials for a student, newest first
      operationId: getIssuedCredentials
      description: Proxies MCP tool `assessments.list_issued_credentials`.
      x-required-capability: authenticated
      x-scope-check: scope.can_view_student(ctx, person_id, purpose="credentials")
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/PersonIdPath"
      responses:
        "200":
          description: Credentials, or `{error}`

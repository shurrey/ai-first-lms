      operationId: exportMeasurement
      x-task: T-E-112
      x-required-capability: ai_review
      x-scope-check: same as GET /api/measurement/courses/{course_id}
      security:
        - sessionCookie: []
      description: |
        For external evaluators. `format=json` returns all three tables in one

  # ---------------------------------------------------------------------------
  # Assessment: submissions, feedback, improvement (planned)
  # ---------------------------------------------------------------------------

  /api/submissions:
    post:
      tags: [assessment]
      summary: Submit a draft, revision or final version of an assignment
      operationId: createSubmission
      x-implementation-status: planned
      x-task: T-D-104
      x-required-capability: submit_work
      x-scope-check: caller is an enrolled student in the assignment's course
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Proxies `assessments.submit`. The submitter is always the caller.
        A draft starts formative feedback asynchronously; poll
        GET /api/feedback/{submission_id} or wait for a notification.
        `parent_id` marks a revision and must be the latest version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignment_id, status, body_md]
              properties:
                assignment_id:
                  type: string
                  format: uuid
                  description: Assignment node id.
                status: {$ref: "#/components/schemas/SubmissionStatus"}
                body_md: {type: string}
                attachments:
                  type: array
                  items: {type: object}
                  default: []
                parent_id:
                  type: [string, "null"]
                  format: uuid
                  description: Previous version this one revises.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Submission"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: A final version already exists, or parent_id is not the latest version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    get:
      tags: [assessment]
      summary: List submissions (latest version per chain unless all_versions)
      operationId: listSubmissions
      x-implementation-status: planned
      x-task: T-D-104
      x-required-capability: authenticated
      x-scope-check: students see only their own; faculty see their own courses
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: assignment_id
          schema: {type: string, format: uuid}
        - in: query
          name: course_id
          schema: {type: string, format: uuid}
        - in: query
          name: person_id
          description: Ignored (forced to self) for the student role.
          schema: {type: string, format: uuid}
        - in: query
          name: all_versions
          schema: {type: boolean, default: false}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Submission"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/submissions/{submission_id}:
    get:
      tags: [assessment]
      summary: One submission version
      operationId: getSubmission
      x-implementation-status: planned
      x-task: T-D-104
      x-required-capability: authenticated
      x-scope-check: submitter, or faculty of the course; others via scope.can_view_student(purpose="submission")
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SubmissionIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Submission"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/submissions/{submission_id}/history:
    get:
      tags: [assessment]
      summary: The version chain containing this submission, oldest first, with per-criterion deltas
      operationId: getSubmissionHistory
      x-implementation-status: planned
      x-task: T-D-104
      x-required-capability: authenticated
      x-scope-check: same as GET /api/submissions/{submission_id}
      security:
        - sessionCookie: []
      description: Proxies `assessments.list_submission_history`.
      parameters:
        - $ref: "#/components/parameters/SubmissionIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [assignment_id, person_id, versions]
                properties:
                  assignment_id: {type: string, format: uuid}
                  person_id: {type: string, format: uuid}
                  versions:
                    type: array
                    items:
                      type: object
                      required: [submission, criteria]
                      properties:
                        submission: {$ref: "#/components/schemas/Submission"}
                        criteria:
                          type: array
                          description: Only criteria whose feedback the caller may see.
                          items:
                            type: object
                            required: [criterion_id, criterion_key, score, delta]
                            properties:
                              criterion_id: {type: string, format: uuid}
                              criterion_key: {type: string}
                              score: {type: [integer, "null"]}
                              delta:
                                type: [integer, "null"]
                                description: Change from the previous version; null on the first.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/feedback/queue:
    get:
      tags: [assessment]
      summary: Feedback awaiting instructor release (Review Queue)
      operationId: getFeedbackQueue
      x-implementation-status: planned
      x-task: T-D-104
      x-required-capability: feedback_release
      x-scope-check: faculty of the course(s); without course_id, all the caller's own courses
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: course_id
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/SubmissionFeedback"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/feedback/{submission_id}:
    get:
      tags: [assessment]
      summary: Criterion-level feedback for a submission
      operationId: getFeedback
      x-implementation-status: planned
      x-task: T-D-104
      x-required-capability: authenticated
      x-scope-check: submitter (released criteria only), or faculty of the course
      security:
        - sessionCookie: []
      description: |
        For the submitter, criteria not yet released are omitted and `status`
        is `pending` or `awaiting_release`. `ai_score` is null for the
        submitter on drafts when `feedback.show_scores_on_drafts=false`.
      parameters:
        - $ref: "#/components/parameters/SubmissionIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubmissionFeedback"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/feedback/{submission_id}/release:
    post:
      tags: [assessment]
      summary: Release (optionally edited) or suppress feedback held under instructor_release
      operationId: releaseFeedback
      x-implementation-status: planned
      x-task: T-D-104
      x-required-capability: feedback_release
      x-scope-check: faculty of the submission's course
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Proxies `assessments.release_feedback`. The request is the human
        approval; it does not go through approval_request. Writes one
        human_decisions row per criterion: `accepted` (unchanged), `edited`
        (diff recorded) or `rejected` (suppressed).
      parameters:
        - $ref: "#/components/parameters/SubmissionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [release, suppress]}
                edits:
                  type: array
                  description: Per-criterion edits applied before release.
                  items:
                    type: object
                    required: [criterion_id]
                    properties:
                      criterion_id: {type: string, format: uuid}
                      score: {type: [integer, "null"]}
                      rationale: {type: [string, "null"]}
                      next_step: {type: [string, "null"]}
                      suppress: {type: boolean, default: false}
                reason: {type: [string, "null"]}
      responses:
        "200":
          description: Released or suppressed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubmissionFeedback"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: Already released or suppressed, or the course uses `auto` release.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "422": {$ref: "#/components/responses/ValidationFailed"}

  /api/improvement/{course_id}:
    get:
      tags: [assessment]
      summary: Student × criterion improvement trajectories for a course
      operationId: getImprovement
      x-implementation-status: planned
      x-task: T-D-104
      x-required-capability: improvement_view
      x-scope-check: |
        student: own trajectory only (student_id forced to self); faculty: own
        course; advisor: assigned students, summary; program_lead/admin:
        aggregate only (students omitted)
      security:
        - sessionCookie: []
      description: |
        Proxies `assessments.get_improvement`. Uses only `course`-visibility
        evidence (§12.5): private practice attempts never appear.
      parameters:
        - $ref: "#/components/parameters/CourseIdPath"
        - in: query
          name: student_id
          schema: {type: string, format: uuid}
        - in: query
          name: criterion_id
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Improvement"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  # ---------------------------------------------------------------------------
  # Provenance (planned)
  # ---------------------------------------------------------------------------

  /api/ai-actions:
    get:
      tags: [provenance]
      summary: '"What the platform generated" log, newest first'
      operationId: listAiActions
      x-task: T-E-112
      x-required-capability: ai_actions_log
      x-scope-check: |
        Filters are intersected with the caller's scope: student = about me
        (subject_person_id forced to self); faculty = own courses;
        program_lead = program courses; advisor = about assigned students;
        admin = all.
        Student and advisor views also leave out feedback that has not
        reached the learner: a grade_draft appears only once its grade is
        committed, criterion_feedback only once released, a rejected one never,
        and decisions carry no diff or reason. GET /api/ai-actions/{id}
        answers 404 for an item left out. Change: T-C-115.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: course_id
          schema: {type: string, format: uuid}
        - in: query
          name: program_id
          schema: {type: string, format: uuid}
        - in: query
          name: subject_person_id
          schema: {type: string, format: uuid}
        - in: query
          name: agent
          schema: {type: string}
        - in: query
          name: action_type
          schema: {$ref: "#/components/schemas/AiActionType"}
        - in: query
          name: decision
          description: Filter by latest human decision; `none` = no decision yet.
          schema:
            oneOf:
              - $ref: "#/components/schemas/HumanDecisionValue"
              - {type: string, const: none}
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/AiAction"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /api/ai-actions/{ai_action_id}:
    get:
      tags: [provenance]
      summary: One generated artifact's provenance (target of the "AI-generated · sources" label)
      operationId: getAiAction
      x-task: T-E-112
      x-required-capability: ai_actions_log
      x-scope-check: same scope rules as GET /api/ai-actions
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/AiActionIdPath"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AiAction"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/ai-actions/{ai_action_id}/decisions:
    post:
      tags: [provenance]
      summary: Record a person's decision on a generated item (Start / Snooze / Not helpful / dismiss alert)
      operationId: recordHumanDecision
      x-task: T-E-110
      x-required-capability: authenticated
      x-scope-check: |
        The subject learner may decide on recommendations, practice items and
        nudges about them; faculty of the course on alerts. Decisions on
        grades, criterion feedback, attestations and credentials are made
        through their own endpoints, not here (403).
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/AiActionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accepted, dismissed, snoozed]
                  description: Start / acted on = accepted; Not helpful / dismiss = dismissed.
                reason:
                  type: [string, "null"]
                  maxLength: 2000
                  description: "Longer reasons are refused with 422. Change: T-C-115."
                snooze_until: {type: [string, "null"], format: date-time}
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanDecision"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationFailed"}


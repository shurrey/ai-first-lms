        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/me/data/disputes:
    post:
      tags: [privacy]
      summary: Dispute a statement in the caller's learner profile
      operationId: disputeProfileStatement
      x-implementation-status: planned
      x-task: T-E-124
      x-required-capability: my_data
      security:
        - sessionCookie: []
          csrfHeader: []
      description: |
        Writes `human_decisions(decision=disputed)` against the profile_update
        ai_action that introduced the statement. The analyst may not reassert
        it without new evidence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [statement]
              properties:
                statement:
                  type: string
                  description: The disputed line, verbatim from MyData.profile.text.
                ai_action_id:
                  type: [string, "null"]
                  format: uuid
                  description: The profile_update action, when known.
                reason: {type: [string, "null"]}
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HumanDecision"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409":
          description: The statement is already disputed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}
        "422":
          description: The statement is not in the caller's current profile, or malformed body.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorDetail"}


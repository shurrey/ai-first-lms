# Runs on every push and PR to main, and on demand. Job ids are the required status-check names
# (see docs/setup.md "Make CI a required check on main").
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed on the event too, so a push to main and a manual run never cancel each other.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-s608:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Flag string-built SQL (ruff S608)
        # graph_lib builds $n placeholders with f-strings and tests run fixed DDL; both are
        # excluded so the gate covers mcp_servers, engine, agents and common.
        run: >-
          uv run ruff check --select S608 --output-format github src/
          --extend-exclude "src/data_mcp/graph_lib,src/data_mcp/tests"

  no-verify-false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if TLS verification is disabled anywhere in src/
        run: |
          if grep -RIn --exclude-dir=node_modules "verify=False" src/; then
            echo "::error::verify=False found; use the shared HTTP client helper instead"
            exit 1
          fi

  language-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      # Terms come from docs/language.md; exceptions from src/platform/ci/language_allowlist.yaml.
      - name: Banned terms in agent prompts and UI copy (spec §14.2)
        run: uv run python src/platform/ci/language_lint.py --format github
      - name: Linter unit tests
        run: uv run pytest src/platform/ci/tests/test_language_lint.py -q

  test-engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_dev
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DB-backed engine tests skip unless this is set; unit tests use fakes and ignore it.
      ENGINE_TEST_DATABASE_URL: postgresql://lms:lms_dev@localhost:5432/lms_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      # Migrations are checked against contracts/db-schema.sql by contract-invariants,
      # so building the test DB with them gives the contract schema.
      - name: Apply schema (alembic upgrade head)
        run: uv run alembic upgrade head
        env:
          LMS_DATABASE_URL: postgresql://lms:lms_dev@localhost:5432/lms_test
      - run: uv run pytest src/engine -q

  test-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - name: Scenario executor unit tests
        run: uv run pytest src/platform/smoke-tests -q

  test-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run pytest src/agents -q

  test-data_mcp:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_dev
          POSTGRES_DB: lms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lms -d lms_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway service DB inside the job.
      LMS_DATABASE_URL: postgresql://lms:lms_dev@localhost:5432/lms_db
    steps:
      - uses: actions/checkout@v4
      # The seed refuses to run without it.
      - name: Set SEED_DEMO_PASSWORD
        # Repo secret when set (absent on fork PRs), otherwise a fresh value per run.
        env:
          SECRET_SEED_DEMO_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD }}
        run: |
          pw="${SECRET_SEED_DEMO_PASSWORD:-$(openssl rand -hex 24)}"
          echo "::add-mask::$pw"
          echo "SEED_DEMO_PASSWORD=$pw" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      # The session fixture seeds before any test runs, so the schema must exist first.
      # test_migrations later drops the schema and rebuilds it with alembic.
      - name: Apply schema
        run: PGPASSWORD=lms_dev psql -v ON_ERROR_STOP=1 -h localhost -U lms -d lms_db -f contracts/db-schema.sql
      - run: uv run pytest src/data_mcp -q

  playwright-smoke-app:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each app's playwright.config.ts starts its own dev server (ultra 3110, chat 3120).
        app: [ultra-frontend, frontend]
    name: playwright-smoke-app (${{ matrix.app }})
    defaults:
      run:
        working-directory: src/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      # Read by the login(page, username) fixture; smoke specs mock the API so any value works.
      - name: Set SEED_DEMO_PASSWORD
        # Repo secret when set (absent on fork PRs), otherwise a fresh value per run.
        env:
          SECRET_SEED_DEMO_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD }}
        run: |
          pw="${SECRET_SEED_DEMO_PASSWORD:-$(openssl rand -hex 24)}"
          echo "::add-mask::$pw"
          echo "SEED_DEMO_PASSWORD=$pw" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: src/${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Smoke specs mock the API routes, so no backend is started.
      - name: Run *.smoke.spec.ts
        run: pnpm exec playwright test '\.smoke\.spec\.ts$'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: |
            src/${{ matrix.app }}/playwright-report
            src/${{ matrix.app }}/test-results
          if-no-files-found: ignore

  # Matrix jobs report as "playwright-smoke-app (<app>)"; this job keeps the stable
  # required-check name and fails unless every app passed.
  playwright-smoke:
    runs-on: ubuntu-latest
    needs: [playwright-smoke-app]
    if: always()
    steps:
      - name: All smoke suites passed
        run: |
          if [ "${{ needs.playwright-smoke-app.result }}" != "success" ]; then
            echo "::error::playwright-smoke-app result: ${{ needs.playwright-smoke-app.result }}"
            exit 1
          fi

  # Full stack with the orchestrator answering from recorded LLM fixtures (no API key) under a
  # fixed LMS_AS_OF, then the live Chat UI scenario specs and scripts/demo all --check. See
  # src/platform/llm-fixtures/README.md. Manual only until a recorded set that replays green is
  # committed (T-P-106); the fixtures come from a Record LLM Fixtures run's artifact.
  # Replays the committed recordings in src/platform/llm-fixtures/recordings; no API key.
  # Manual only: recordings are made once, when the project is done, so they match the final code.
  e2e-live-replay:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Seeds every account; the live specs and scripts/demo sign in with it.
      - name: Set SEED_DEMO_PASSWORD
        # Repo secret when set (absent on fork PRs), otherwise a fresh value per run.
        env:
          SECRET_SEED_DEMO_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD }}
        run: |
          pw="${SECRET_SEED_DEMO_PASSWORD:-$(openssl rand -hex 24)}"
          echo "::add-mask::$pw"
          echo "SEED_DEMO_PASSWORD=$pw" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: src/frontend
      - name: Replay fixtures through the live specs and scripts/demo
        run: src/platform/llm-fixtures/run-live-e2e replay
        env:
          KEEP_STACK: "1"
      - name: Collect logs on failure
        if: failure()
        run: docker compose -p lms-llm-fixtures -f docker-compose.yaml -f src/platform/llm-fixtures/compose.yaml logs --tail=300
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e-live
          path: |
            src/frontend/playwright-report
            src/frontend/test-results
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose -p lms-llm-fixtures -f docker-compose.yaml -f src/platform/llm-fixtures/compose.yaml down -v

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SEED_DEMO_PASSWORD is a required variable; compose rejects the file without it.
      - name: Set SEED_DEMO_PASSWORD
        # Repo secret when set (absent on fork PRs), otherwise a fresh value per run.
        env:
          SECRET_SEED_DEMO_PASSWORD: ${{ secrets.SEED_DEMO_PASSWORD }}
        run: |
          pw="${SECRET_SEED_DEMO_PASSWORD:-$(openssl rand -hex 24)}"
          echo "::add-mask::$pw"
          echo "SEED_DEMO_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Validate docker-compose.yaml
        run: docker compose config -q
      - name: Check smoke test scripts are executable
        run: |
          for f in src/platform/smoke-tests/test_*.sh; do
            [ -x "$f" ] || { echo "FAIL: $f is not executable"; exit 1; }
          done

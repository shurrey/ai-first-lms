id: 3
name: "Grading: rubric-based scoring with approval"
login_as: "m.torres@university.edu"
active_role: faculty
course_id: "cs101"

user_turns:
  - message: "Grade submissions for Essay 3 with my rubric."
    # One gated assessments.commit_grade per drafted submission. A commit needs the
    # instructor's scores and closing comment: the script confirms the drafted scores.
    approvals:
      - decision: approve
        commit_comment: "Reviewed against the rubric; scores confirmed."
    default_approval:
      decision: approve
      commit_comment: "Reviewed against the rubric; scores confirmed."

expected:
  final_event: final
  artifacts_of_type:
    - rubric_grades
  min_agent_invocations: 1
  max_wall_time_ms: 120000  # the SPEC-v1 §4.5 turn budget (approval waits excluded)

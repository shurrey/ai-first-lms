version: 1
agent:
  name: early_alert
  version: 0.1.0
  description: 'Detects at-risk students with explanations and recommends interventions.

    Explains every risk score. Recommends — never acts.

    '
  persona_scope:
  - faculty
  - advisor
  - admin
  model: claude-sonnet-4-6
  requires_pii:
  - display_name
  inputs:
    type: object
    properties:
      scope:
        type: object
      window_days:
        type: integer
        default: 14
      risk_threshold:
        type: number
        default: 0.5
    required:
    - scope
  outputs:
    type: object
    properties:
      at_risk:
        type: array
      methodology_note:
        type: string
    required:
    - at_risk
  mcp_tools:
  - roster.get_student_context
  - assessments.list_recent_evidence
  - roster.list_by_course
  - analytics.query
  - analytics.trend
  - analytics.cohort_compare
  - sis.get_transcript
  - sis.catalog_search
  - graph.mastery_map
  - attestations.get_student_attestations
  composable_with:
  - engagement_analyst
  - communication
  - content_generator
  requires_human_approval: false

- id: fb-eng102-counterargument-dismissed
  inputs:
    message: Review submission sub-e06.
    persona: student
    submission_id: sub-e06
    submission_body: |
      # Fixing Weak Sources at the Start

      A required first-year information literacy course would cut down on the weak sourcing that faculty complain about in upper-level papers.

      In Project Information Literacy's 2010 survey, Head and Eisenberg found that most students turned to course readings and Google first and asked librarians for help least often, which helps explain why so many papers cite only what was easiest to find. The Stanford History Education Group's 2016 study showed that students struggle to evaluate websites.

      Teaching students to check who publishes a source in one required course would address both problems at once. Some say students will not take a required course seriously, but thats just an excuse.

      Works cited: Head and Eisenberg (2010); Stanford History Education Group (2016).
  expected:

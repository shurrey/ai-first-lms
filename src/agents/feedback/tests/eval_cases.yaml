      thesis:
        level: 3
        evidence_spans:
        - Colleges should require a information literacy course for every freshmen because students cant
          tell good sources from bad ones
      evidence:
        level: 3
        evidence_spans:
        - over 80 percent of middle school students thought a sponsored ad was a real news story
        - students use the same few search strategys over and over even when they dont work
      analysis:
        level: 3
        evidence_spans:
        - so the course protects the quality of all there other classes
        - most professors dont have time and they assume students learned it in high school
      writing_mechanics:
        level: 2
        evidence_spans:
        - Colleges should require a information literacy course for every freshmen
        - also show that students use the same few search strategys
        - there own classes. but most professors dont have time
    assertions:

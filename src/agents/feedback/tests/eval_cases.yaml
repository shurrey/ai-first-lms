      # The ACRL Framework

      The Association of College and Research Libraries has a framework for information literacy (ACRL, 2016). It has six frames, such as Authority Is Constructed and Contextual and Searching as Strategic Exploration. The framework was adopted in 2016 and replaced older standards.


      Information literacy is a topic that many people talk about today. There are good and bad sides to requiring a course in it, and colleges have to think about what is best for their students.

      According to a librarian I read about online, students do not know how to use databases. This shows that some students need help. On the other hand some students already know how to research.

      In the end it depends on the college and the students. Colleges should think carefully about this issue.

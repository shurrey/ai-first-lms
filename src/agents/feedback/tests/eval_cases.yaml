- id: fb-eng102-mechanics-errors-solid-argument
  inputs:
    message: Review submission sub-e04.
    persona: student
    submission_id: sub-e04
    submission_body: |
      # Why Every Freshmen Needs This Course

      Colleges should require a information literacy course for every freshmen because students cant tell good sources from bad ones and this effects everything they write.

      In a 2016 study the Stanford History Education Group found that over 80 percent of middle school students thought a sponsored ad was a real news story, and college students in the same study had trouble checking who was behind a website. Alison Head's research for Project Information Literacy also show that students use the same few search strategys over and over even when they dont work.

      If students cant judge sources they will build there arguments on bad information, so the course protects the quality of all there other classes.

      Some people say professors should just teach this in there own classes. but most professors dont have time and they assume students learned it in high school, so it never gets taught.
  expected:

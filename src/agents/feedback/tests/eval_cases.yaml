- id: fb-eng102-revision-improves
  inputs:
    message: Review submission sub-e07.
    persona: student
    submission_id: sub-e07
    parent_case: fb-eng102-vague-thesis-one-source
    submission_body: |
      # Information Literacy Should Be Required

      Colleges should require a first-year information literacy course, because many students arrive without the research skills their classes assume.

      In Project Information Literacy's 2010 survey, Head and Eisenberg found that most students used the same few search strategies for every assignment, even when those strategies failed. The Stanford History Education Group (2016) found that students judged websites by their appearance instead of checking who published them. Both studies describe habits that a single course could change before students write their first research paper.

      Some argue that students who already know how to research would waste a semester. A placement test could let those students skip the course, so the requirement only reaches students who need it.

      Colleges that want stronger research papers should start with this course.

      Works cited: Head and Eisenberg (2010); Stanford History Education Group (2016).
  expected:

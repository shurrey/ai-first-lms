# Feedback agent evals (spec.md §7.4, §20).
# The rubric mirrors the ENG 102 four-criterion essay rubric; keep its keys and level
# scores in step with the seeded rubric. Scored by eval_harness.score_feedback_case.
rubric:
  id: eval-eng102-essay2-rubric
  title: 'ENG 102 Essay 2: Argument from sources'
  assignment_prompt: Should colleges require first-year students to take an information literacy course?
    Take a position, support it with at least two sources, and address one counterargument. 700-1000 words.
  criteria:
  - criterion_id: crit-thesis
    key: thesis
    description: States a clear, arguable position on the question.
    levels:
    - score: 1
      label: Beginning
      descriptor: No identifiable position.
    - score: 2
      label: Developing
      descriptor: Position is present but vague, hedged or merely descriptive.
    - score: 3
      label: Proficient
      descriptor: Clear, arguable position stated early.
    - score: 4
      label: Exemplary
      descriptor: Precise, qualified position that frames the whole essay.
  - criterion_id: crit-evidence
    key: evidence
    description: Supports the position with relevant, accurately attributed source evidence.
    levels:
    - score: 1
      label: Beginning
      descriptor: No source evidence, or evidence unrelated to the claim.
    - score: 2
      label: Developing
      descriptor: One source, or sources dropped in without connecting them to the claim.
    - score: 3
      label: Proficient
      descriptor: Two or more relevant sources, accurately attributed and tied to the claim.
    - score: 4
      label: Exemplary
      descriptor: Well-chosen sources with specific detail, introduced with signal phrases, that directly
        advance the argument.
  - criterion_id: crit-analysis
    key: analysis
    description: Explains how the evidence supports the position and answers an objection.
    levels:
    - score: 1
      label: Beginning
      descriptor: Summary only; no reasoning or counterargument.
    - score: 2
      label: Developing
      descriptor: Some reasoning; counterargument missing or dismissed in a sentence.
    - score: 3
      label: Proficient
      descriptor: Reasoning connects evidence to claim; one counterargument addressed.
    - score: 4
      label: Exemplary
      descriptor: Insightful reasoning; counterargument engaged fairly and answered convincingly.
  - criterion_id: crit-writing-mechanics
    key: writing_mechanics
    description: Organization, clarity, grammar and citation.
    levels:
    - score: 1
      label: Beginning
      descriptor: Frequent errors obscure meaning.
    - score: 2
      label: Developing
      descriptor: Noticeable errors or weak organization distract the reader.
    - score: 3
      label: Proficient
      descriptor: Clear and organized with few errors; sources cited.
    - score: 4
      label: Exemplary
      descriptor: Polished, well-organized prose with consistent citation.
labeling:
  target_cases: 30
  labeled_cases: 12
  labels_by: agents lane, from the rubric descriptors; pending review by an ENG 102 instructor
  pass_rule: A case passes when every criterion's level is within its tolerance (default 0), every quote
    is verbatim, and each criterion has one next step. The suite passes at >= 80% of cases.
cases:
- id: fb-eng102-strong-qualified-thesis
  inputs:
    message: Review submission sub-e01.
    persona: student
    submission_id: sub-e01
    submission_body: |
      # A Required Course, Built for Writing

      Colleges should require a one-semester information literacy course in the first year, not as another general education box but as the place where students learn to judge sources before they write with them.

      A 2016 study by the Stanford History Education Group found that most of the students it tested could not tell a sponsored post from a news article. Head and Eisenberg's Project Information Literacy surveys report that students lean on the first page of search results and rarely change strategies when a search fails. These findings point to habits, not ability, and habits are what a required course can change.

      Critics argue that information literacy should be woven into every course instead of taught on its own. That is a fair goal, but a skill that belongs to every course is assessed in none; a required course gives faculty a shared foundation to build on rather than a substitute for their own teaching.

      A required course is the most direct way to make sure every student starts with the same tools for judging what they read.

      Works cited: Head and Eisenberg (2010); Stanford History Education Group (2016).
  expected:
    criteria:
      thesis:
        level: 4
        evidence_spans:
        - Colleges should require a one-semester information literacy course in the first year, not as
          another general education box
      evidence:
        level: 3
        evidence_spans:
        - most of the students it tested could not tell a sponsored post from a news article
        - students lean on the first page of search results and rarely change strategies when a search
          fails
      analysis:
        level: 4
        evidence_spans:
        - That is a fair goal, but a skill that belongs to every course is assessed in none
        - These findings point to habits, not ability, and habits are what a required course can change.
      writing_mechanics:
        level: 4
        evidence_spans:
        - 'Works cited: Head and Eisenberg (2010); Stanford History Education Group (2016).'
    assertions:
    - uses_tool: assessments.get_submission
    - uses_tool: assessments.get_rubric
    - saves_once: assessments.save_criterion_feedback
    - criterion_levels_match_labels: true
    - evidence_spans_verbatim: true
    - one_next_step_per_criterion: true
    - assigns_no_grade: true
    - top_level_next_step_sustains_strength: true

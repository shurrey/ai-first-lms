- id: fb-eng102-nuanced-thesis-uneven-citation
  inputs:
    message: Review submission sub-e10.
    persona: student
    submission_id: sub-e10
    submission_body: |
      # A Course Inside the Writing Sequence

      Requiring an information literacy course makes sense only if the course is tied to the writing students are already doing; a stand-alone lecture course would repeat the failures of the library orientations it replaces.

      Head and Eisenberg's 2010 survey for Project Information Literacy found that students rarely sought help from librarians and fell back on familiar search routines, which suggests that one-time orientations do not change habits (Head & Eisenberg). According to the stanford history education group, students judged credibility by a site's design.

      Opponents argue that any new requirement crowds out courses in the major, and they are right that credit hours are scarce. That is why the course should replace part of the existing first-year writing sequence rather than add to it: students would practice evaluating sources on the essays they are already assigned, and no major loses a credit.

      A course built this way would teach source judgment where students actually use it.

      Sources: Head, Alison J. and Michael B. Eisenberg. 2010. stanford history ed group 2016 website
  expected:
    criteria:
      thesis:
        level: 4
        evidence_spans:
        - Requiring an information literacy course makes sense only if the course is tied to the writing
          students are already doing
      evidence:
        level: 3
        evidence_spans:
        - students rarely sought help from librarians and fell back on familiar search routines
        - According to the stanford history education group, students judged credibility by a site's design.
      analysis:
        level: 4
        evidence_spans:
        - they are right that credit hours are scarce
        - That is why the course should replace part of the existing first-year writing sequence rather
          than add to it
      writing_mechanics:
        level: 3
        evidence_spans:
        - 'Sources: Head, Alison J. and Michael B. Eisenberg. 2010. stanford history ed group 2016 website'
        - According to the stanford history education group
    assertions:
    - uses_tool: assessments.get_submission
    - uses_tool: assessments.get_rubric
    - saves_once: assessments.save_criterion_feedback
    - criterion_levels_match_labels: true
    - evidence_spans_verbatim: true
    - one_next_step_per_criterion: true
    - assigns_no_grade: true

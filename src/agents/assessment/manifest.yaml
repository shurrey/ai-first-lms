version: 1
agent:
  name: assessment
  version: 0.1.0
  description: 'Generates and validates assessments — quiz/exam questions, rubrics,
    item analysis.

    '
  persona_scope:
  - faculty
  - instructional_designer
  - admin
  - advisor
  - program_lead
  model: claude-sonnet-4-6
  requires_pii: []
  inputs:
    type: object
    properties:
      topic_or_nodes:
        type: array
        items:
          type: string
      question_types:
        type: array
        items:
          type: string
          enum:
          - mcq
          - short_answer
          - essay
          - code
      count:
        type: integer
        minimum: 1
        maximum: 50
      difficulty:
        type: string
        enum:
        - intro
        - moderate
        - advanced
        - mixed
      include_rubric:
        type: boolean
        default: false
    required:
    - topic_or_nodes
    - question_types
    - count
  outputs:
    type: object
    properties:
      questions:
        type: array
      rubric:
        type: object
        nullable: true
      warnings:
        type: array
        items:
          type: string
    required:
    - questions
  mcp_tools:
  - assessments.create_question
  - assessments.search_bank
  - assessments.get_rubric
  - assessments.list_recent_evidence
  - assessments.list_pending_credentials
  - assessments.get_credential_evidence
  - assessments.approve_credential
  - assessments.list_issued_credentials
  - roster.get_student
  - roster.list_by_course
  - graph.mastery_map
  - attestations.get_student_attestations
  - roster.list_student_sessions
  composable_with:
  - content_generator
  requires_human_approval: true

version: 1
agent:
  name: advising
  version: 0.1.0
  description: 'Academic planning — degree audit, course recommendations, prerequisites,

    pathway mapping. In AI-native deployment also serves as Learning Path Navigator.

    '
  persona_scope:
  - student
  - advisor
  - faculty
  - admin
  - program_lead
  model: claude-sonnet-4-6
  requires_pii:
  - email
  - display_name
  inputs:
    type: object
    properties:
      student_id:
        type: string
      intent:
        type: string
        enum:
        - next_term
        - degree_plan
        - pathway_explore
        - learning_path
      constraints:
        type: object
        nullable: true
    required:
    - student_id
    - intent
  outputs:
    type: object
    properties:
      audit:
        type: object
      recommendations:
        type: array
      alternatives:
        type: array
      risks:
        type: array
      path_visualization:
        type: object
        nullable: true
    required:
    - audit
    - recommendations
  mcp_tools:
  - roster.get_student_context
  - roster.get_student
  - sis.get_transcript
  - sis.degree_audit
  - sis.catalog_search
  composable_with:
  - tutor
  - content_generator
  requires_human_approval: false
